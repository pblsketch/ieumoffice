              data_dir = Path(out.strip())
              samples_dir = data_dir / "Documents" / "Samples"
              samples_dir.mkdir(parents=True, exist_ok=True)

              src_hwpx = repo_root / "apps/mobile/src-tauri/src/storage/samples" / (
                  "welcome-ko.hwpx" if short_lang == "ko" else "welcome-en.hwpx"
              )
              if short_lang == "ko":
                  names = tuple(
                      unicodedata.normalize("NFC", s)
                      for s in (
                          "이음오피스 시작하기.hwpx",
                          "2026년 2분기 업무 보고서.pdf",
                          "주간 프로젝트 메모.md",
                          "월간 예산 정리표.xlsx",
                      )
                  )
              else:
                  names = (
                      "Welcome to IeumOffice.hwpx",
                      "Q2 Operations Report.pdf",
                      "Weekly Project Notes.md",
                      "Monthly Budget Sheet.xlsx",
                  )

              hwpx_path = samples_dir / names[0]
              pdf_path = samples_dir / names[1]
              md_path = samples_dir / names[2]
              xlsx_path = samples_dir / names[3]

              copy_hwpx_with_preview(src_hwpx, hwpx_path, HWPX_PREVIEW_TEXT[loc_tag])
              pdf_bytes = build_clean_pdf(
                  "Q2 Operations Report" if short_lang == "en" else "2026 Q2 Project Brief",
                  "IeumOffice Mobile  |  Document Overview",
                  [
                      ("Hangul & Office Readers", "Ready", "100%"),
                      ("PDF Export & AirPrint", "Ready", "100%"),
                      ("Offline Document Storage", "Verified", "100%"),
                      ("Tablet Reading Layout", "Verified", "100%"),
                  ],
              )
              pdf_path.write_bytes(pdf_bytes)
              md_path.write_text(MD_SAMPLE[loc_tag], encoding="utf-8")
              build_clean_xlsx(xlsx_path)

              now_ms = int(time.time() * 1000)

              recent_entries = [
                  {
                      "id": "demo-hwpx",
                      "doc_key": "demo-hwpx",
                      "uri": hwpx_path.as_uri(),
                      "name": names[0],
                      "format": "hwpx",
                      "opened_at": now_ms - 180_000,
                  },
                  {
                      "id": "demo-pdf",
                      "doc_key": "demo-pdf",
                      "uri": pdf_path.as_uri(),
                      "name": names[1],
                      "format": "pdf",
                      "opened_at": now_ms - 1_500_000,
                  },
                  {
                      "id": "demo-md",
                      "doc_key": "demo-md",
                      "uri": md_path.as_uri(),
                      "name": names[2],
                      "format": "md",
                      "opened_at": now_ms - 5_400_000,
                  },
                  {
                      "id": "demo-xlsx",
                      "doc_key": "demo-xlsx",
                      "uri": xlsx_path.as_uri(),
                      "name": names[3],
                      "format": "xlsx",
                      "opened_at": now_ms - 86_400_000,
                  },
              ]

              prefs = {
                  "lang": short_lang,
                  "theme": "system",
                  "hwpDefaultFormat": "hwpx",
                  "aiEnabled": False,
                  "editorsOff": [],
                  "homeKindsHidden": [],
                  "homeKindsOrder": [],
                  "keepScreenOnWhileReading": True,
                  "firstRunDone": True,
                  "tipsSeen": ["editButton", "flowView", "firstEdit", "firstKeyboard"],
                  "lastSeenVersion": "0.1.0",
              }

              # Write to both Application Support/<bundle_id> (Tauri iOS app_data_dir)
              # and Application Support root so lookup succeeds regardless of layout.
              for target_dir in (
                  data_dir / "Library" / "Application Support" / bundle_id,
                  data_dir / "Library" / "Application Support",
              ):
                  target_dir.mkdir(parents=True, exist_ok=True)
                  (target_dir / "prefs.json").write_text(json.dumps(prefs, ensure_ascii=False, indent=2), encoding="utf-8")
                  (target_dir / "recent.json").write_text(json.dumps(recent_entries, ensure_ascii=False, indent=2), encoding="utf-8")

              trace(f"  Seeded container {data_dir} with 4 samples + prefs.json + recent.json")
              return data_dir

          DEVICES = [
              ("iphone-6.9", ["iPhone 17 Pro Max", "iPhone 16 Pro Max", "Pro Max"]),
              ("ipad-13", ["iPad Pro 13-inch (M5)", "iPad Pro 13-inch", "13-inch"]),
          ]
          LOCALES = [
              ("ko-KR", "ko_KR", ["ko-KR", "ko", "en"], "ko"),
              ("en-US", "en_US", ["en-US", "en"], "en"),
          ]

          report = {"runs": []}

          for dev_key, dev_prefs in DEVICES:
              rt, dev_name, udid = pick_sim_device(dev_prefs)
              is_ipad = dev_key.startswith("ipad")
              trace(f"=== Store Shots Device: {dev_key} -> {dev_name} ({rt}) [{udid}] ===")
              run_cmd(["xcrun", "simctl", "boot", udid], timeout=45)
              run_cmd(["xcrun", "simctl", "bootstatus", udid, "-b"], timeout=180)
              time.sleep(6.0)
              apply_clean_status_bar(udid)

              try:
                  for loc_tag, apple_locale, apple_langs, short_lang in LOCALES:
                      out_dir = shots_root / dev_key / loc_tag
                      out_dir.mkdir(parents=True, exist_ok=True)
                      run_info = {
                          "device_key": dev_key,
                          "device_name": dev_name,
                          "runtime": rt,
                          "udid": udid,
                          "locale": loc_tag,
                          "shots": [],
                          "checks": {},
                          "errors": [],
                      }
                      trace(f"--- Capturing {dev_key} / {loc_tag} ---")

                      run_cmd(["xcrun", "simctl", "terminate", udid, bundle_id], timeout=15)
                      run_cmd(["xcrun", "simctl", "uninstall", udid, bundle_id], timeout=30)
                      run_cmd(["xcrun", "simctl", "install", udid, app_path], timeout=60)

                      run_cmd(["xcrun", "simctl", "spawn", udid, "defaults", "write", "-g", "AppleLanguages", "-array", *apple_langs], timeout=15)
                      run_cmd(["xcrun", "simctl", "spawn", udid, "defaults", "write", "-g", "AppleLocale", "-string", apple_locale], timeout=15)
                      run_cmd(["xcrun", "simctl", "ui", udid, "appearance", "light"], timeout=15)
                      apply_clean_status_bar(udid)

                      seed_app_container(udid, loc_tag, short_lang)

                      def launch_app_once():
                          for launch_try in range(1, 3):
                              rc_l, out_l, err_l = run_cmd([
                                  "xcrun", "simctl", "launch", udid, bundle_id,
                                  "-AppleLanguages", f"({loc_tag})",
                                  "-AppleLocale", apple_locale,
                              ], timeout=90)
                              if rc_l == 0:
                                  return True, out_l
                              trace(f"  launch attempt {launch_try} failed (rc={rc_l}): {err_l[:120]}")
                              time.sleep(5.0)
                          return False, err_l

                      ok_l, info_l = launch_app_once()
                      if not ok_l:
                          msg = f"launch failed: {info_l}"
                          trace(f"  [ERROR] {msg}")
                          run_info["errors"].append(msg)
                          report["runs"].append(run_info)
                          continue

                      time.sleep(3.5)
                      insp = connect_inspector(udid)
                      if not insp:
                          msg = "WebInspector failed to connect"
                          trace(f"  [ERROR] {msg}")
                          run_info["errors"].append(msg)
                          report["runs"].append(run_info)
                          continue

                      # Re-apply 9:41 status bar AFTER SpringBoard and the app are awake
                      # so iPad ko-KR never falls back to system clock time.
                      apply_clean_status_bar(udid)
                      time.sleep(1.5)

                      try:
                          # Ensure Home screen is ready (and skip FirstRun if somehow shown)
                          if wait_visible(insp, ['[data-testid="home-run-first-start"]'], timeout_s=3.0, poll_s=0.4):
                              trace("  FirstRun overlay appeared unexpectedly; clicking Start")
                              click_ui(insp, ['[data-testid="home-run-first-start"]'])
                          if not wait_visible(insp, ['[data-testid="home-recent-list"]', '[data-testid="home-empty-sample"]'], timeout_s=20.0):
                              run_info["errors"].append("Home list not visible after launch")

                          # Verify active UI language matches requested locale
                          doc_lang = str(insp.eval_js("document.documentElement.lang || ''") or "")
                          trace(f"  Active document.documentElement.lang = {doc_lang!r} (want {short_lang!r})")
                          if not doc_lang.lower().startswith(short_lang):
                              trace(f"  Switching app language to {short_lang} via Settings...")
                              click_ui(insp, ['[data-testid="home-tab-settings"]', '[data-testid="home-settings-btn"]'])
                              if wait_visible(insp, ['[data-testid="settings-lang-select"]'], timeout_s=10.0):
                                  insp.eval_js(f"""(() => {{
                                    const sel = document.querySelector('[data-testid="settings-lang-select"]');
                                    if (!sel) return false;
                                    const setter = Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype, 'value').set;
                                    setter.call(sel, {json.dumps(short_lang)});
                                    sel.dispatchEvent(new Event('change', {{ bubbles: true }}));
                                    return true;
                                  }})()""")
                                  time.sleep(1.0)
                              click_ui(insp, ['[data-testid="settings-back-btn"]', 'header button'], ["뒤로", "Back"])
                              wait_visible(insp, ['[data-testid="home-recent-list"]', '[data-testid="home-empty-sample"]'], timeout_s=12.0)

                          # Install lightweight read-only diagnostics hook for toasts, console errors,
                          # and print/share IPC lifecycles.
                          def install_shot_diag(client):
                              try:
                                  client.eval_js("""(() => {
                                    if (window.__ieumShotDiag) return true;
                                    const d = { toasts: [], errors: [], ipc: [], inFlight: {} };
                                    window.__ieumShotDiag = d;
                                    const origErr = console.error.bind(console);
                                    console.error = (...args) => {
                                      try { d.errors.push(args.map(a => String(a)).join(' ').slice(0, 300)); } catch {}
                                      return origErr(...args);
                                    };
                                    window.addEventListener('unhandledrejection', (e) => {
                                      try { d.errors.push('unhandledrejection: ' + String(e.reason).slice(0, 300)); } catch {}
                                    });
                                    const obs = new MutationObserver(() => {
                                      const el = document.querySelector('[data-testid="mobile-toast"]');
                                      if (el) {
                                        const txt = (el.innerText || '').trim();
                                        if (txt && d.toasts[d.toasts.length - 1] !== txt) d.toasts.push(txt);
                                      }
                                    });
                                    obs.observe(document.body, { childList: true, subtree: true, characterData: true });
                                    const ti = window.__TAURI_INTERNALS__;
                                    if (ti && typeof ti.invoke === 'function' && !ti.__ieumWrapped) {
                                      const origInvoke = ti.invoke.bind(ti);
                                      ti.__ieumWrapped = true;
                                      ti.invoke = function(cmd, args, options) {
                                        const track = typeof cmd === 'string' && (cmd.includes('print') || cmd.includes('share'));
                                        const id = track ? (cmd + '#' + (d.ipc.length + 1)) : null;
                                        if (track) {
                                          d.inFlight[id] = Date.now();
                                          d.ipc.push({ id, cmd, state: 'pending' });
                                        }
                                        const p = origInvoke(cmd, args, options);
                                        if (track && p && typeof p.then === 'function') {
                                          return p.then(
                                            (val) => {
                                              delete d.inFlight[id];
                                              d.ipc.push({ id, cmd, state: 'ok' });
                                              return val;
                                            },
                                            (err) => {
                                              delete d.inFlight[id];
                                              d.ipc.push({ id, cmd, state: 'err', err: String(err && (err.message || err.detail || JSON.stringify(err)) || err).slice(0, 300) });
                                              throw err;
                                            }
                                          );
                                        }
                                        return p;
                                      };
                                    }
                                    return true;
                                  })()""")
                              except Exception as exc:
                                  trace(f"  install_shot_diag warning: {exc}")

                          install_shot_diag(insp)

                          # Switch Home recent list to Card Grid view so document thumbnails stand out clearly
                          try:
                              cur_view = insp.eval_js("document.querySelector('[data-testid=\"home-recent-list\"]')?.getAttribute('data-view') || ''")
                          except Exception:
                              cur_view = ""
                          if cur_view != "grid":
                              click_ui(insp, ['[data-testid="home-view-mode-btn"]'])
                              time.sleep(1.0)

                          # Wait up to 20s for lazy document thumbnails (PDFKit + HWPX + MD + XLSX) to render
                          thumb_info = {}
                          thumb_deadline = time.time() + 20.0
                          while time.time() < thumb_deadline:
                              try:
                                  thumb_info = insp.eval_js("""(() => {
                                    const list = document.querySelector('[data-testid="home-recent-list"]');
                                    const thumbs = Array.from(document.querySelectorAll('[data-testid^="home-file-thumb-"]'));
                                    const items = thumbs.map(el => {
                                      const img = el.querySelector('img');
                                      return {
                                        id: el.getAttribute('data-testid'),
                                        kind: el.getAttribute('data-thumb-kind'),
                                        imgReady: img ? (img.complete && img.naturalWidth > 0) : null,
                                      };
                                    });
                                    const readyCount = items.filter(x => x.kind === 'text' || (x.kind === 'image' && x.imgReady)).length;
                                    return { view: list ? list.getAttribute('data-view') : null, count: items.length, readyCount, items };
                                  })()""", timeout_s=25.0) or {}
                                  if thumb_info.get("count", 0) >= 4 and thumb_info.get("readyCount", 0) >= 4:
                                      break
                              except Exception as exc:
                                  trace(f"  thumbnail poll transient error: {exc}")
                              time.sleep(1.0)
                          run_info["checks"]["home_thumbnails"] = thumb_info
                          trace(f"  Home thumbnails: view={thumb_info.get('view')} ready={thumb_info.get('readyCount')}/{thumb_info.get('count')} items={thumb_info.get('items')}")

                          # Scene 1: Home (recent docs + thumbnails, zero tips/toasts)
                          clean1 = dismiss_tips_and_check_clean(insp)
                          run_info["checks"]["01_home_clean"] = clean1
                          apply_clean_status_bar(udid)
                          time.sleep(1.2)
                          s1 = take_shot(udid, out_dir / "01-home.png")
                          s1["ready"] = (thumb_info.get("readyCount", 0) >= 3) and not clean1.get("tip") and not clean1.get("toast")
                          run_info["shots"].append(s1)
                          trace(f"  [SHOT] 01-home.png ok={s1['ok']} ready={s1['ready']} {s1['width']}x{s1['height']} ct={s1['color_type']}")

                          # Scene 2: Sample HWP Reading View (flow view; tablet 40rem centered)
                          opened_hwpx = click_ui(insp, [
                              '[data-testid="home-file-row-open-recent:demo-hwpx"]',
                              '[data-testid="home-empty-sample"]',
                          ])
                          trace(f"  Opened HWPX via: {opened_hwpx}")
                          wait_visible(
                              insp,
                              ['[data-testid="view-tool-pageView"]', '[data-testid="view-tool-flowView"]'],
                              ["쪽 화면", "Page view", "읽기 화면", "Reading view"],
                              timeout_s=35.0,
                          )
                          if wait_visible(insp, ['[data-testid="view-tool-flowView"]'], ["읽기 화면", "Reading view"], timeout_s=1.5, poll_s=0.3):
                              trace("  HWP opened in Page view (tablet default); switching to Reading view for 02-hwp-reading.png")
                              click_ui(insp, ['[data-testid="view-tool-flowView"]'], ["읽기 화면", "Reading view"])
                          flow_ok = wait_hwp_flow(insp, timeout_s=35.0)
                          clean2 = dismiss_tips_and_check_clean(insp)
                          flow_metrics = insp.eval_js("""(() => {
                            const f = document.querySelector('iframe.mobile-hwp-flow-frame');
                            if (!f || !f.contentDocument) return null;
                            const body = f.contentDocument.body;
                            const st = f.contentWindow.getComputedStyle(body);
                            const main = body.firstElementChild;
                            const mr = main ? main.getBoundingClientRect() : null;
                            return {
                              viewportW: window.innerWidth,
                              bodyMaxW: st.maxWidth,
                              mainW: mr ? Math.round(mr.width) : null,
                              mainLeft: mr ? Math.round(mr.left) : null,
                            };
                          })()""")
                          run_info["checks"]["02_hwp_reading"] = {"clean": clean2, "metrics": flow_metrics}
                          trace(f"  02-hwp-reading metrics={flow_metrics} clean={clean2}")
                          time.sleep(1.8)
                          s2 = take_shot(udid, out_dir / "02-hwp-reading.png")
                          s2["ready"] = flow_ok and not clean2.get("tip")
                          run_info["shots"].append(s2)
                          trace(f"  [SHOT] 02-hwp-reading.png ok={s2['ok']} ready={s2['ready']} {s2['width']}x{s2['height']} ct={s2['color_type']}")

                          # Scene 3: Sample HWP Page View
                          click_ui(insp, ['[data-testid="view-tool-pageView"]'], ["쪽 화면", "Page view"])
                          page_ok = wait_hwp_page(insp, timeout_s=35.0)
                          clean3 = dismiss_tips_and_check_clean(insp)
                          run_info["checks"]["03_hwp_page_clean"] = clean3
                          time.sleep(2.2)
                          s3 = take_shot(udid, out_dir / "03-hwp-page.png")
                          s3["ready"] = page_ok and not clean3.get("tip")
                          run_info["shots"].append(s3)
                          trace(f"  [SHOT] 03-hwp-page.png ok={s3['ok']} ready={s3['ready']} {s3['width']}x{s3['height']} ct={s3['color_type']}")

                          # Scene 5: [...] More sheet (Document + File sections with Print & Share as PDF)
                          click_ui(insp, ['[data-testid="editor-more-btn"]'])
                          more_ok = bool(wait_visible(insp, ['[data-testid="editor-more-sheet"]'], timeout_s=10.0))
                          time.sleep(1.2)
                          s5 = take_shot(udid, out_dir / "05-more-sheet.png")
                          s5["ready"] = more_ok
                          run_info["shots"].append(s5)
                          trace(f"  [SHOT] 05-more-sheet.png ok={s5['ok']} ready={more_ok} {s5['width']}x{s5['height']} ct={s5['color_type']}")

                          # Scene 6: Print / Share as PDF native iOS system sheet
                          def read_shot_diag(client):
                              try:
                                  return client.eval_js("window.__ieumShotDiag || null", timeout_s=10.0) or {}
                              except Exception as exc:
                                  return {"eval_error": str(exc)}

                          def wait_native_sheet_presented(client, wait_s=20.0):
                              deadline = time.time() + wait_s
                              last_diag = {}
                              last_ax = []
                              while time.time() < deadline:
                                  time.sleep(1.5)
                                  last_diag = read_shot_diag(client)
                                  in_flight = last_diag.get("inFlight") or {}
                                  ipc = last_diag.get("ipc") or []
                                  # Native Print/Share call stays pending while the iOS modal sheet is presented.
                                  pending_native = [
                                      k for k in in_flight
                                      if "print_stage_finish" in k or "print_session_pdf" in k or "share_file" in k
                                  ]
                                  if pending_native:
                                      time.sleep(2.5)
                                      return "ipc_pending:" + pending_native[0], last_diag, describe_ax_nodes(udid)
                                  if last_diag.get("eval_error"):
                                      # WebView paused behind a presented native sheet.
                                      time.sleep(2.0)
                                      return "webview_paused_modal", last_diag, describe_ax_nodes(udid)
                                  last_ax = describe_ax_nodes(udid)
                                  hit = find_ax_button(last_ax, [
                                      "프린트 옵션", "Print Options", "프린터", "Printer",
                                      "프린트", "Print", "매수", "Copies", "AirDrop",
                                  ])
                                  if hit:
                                      time.sleep(2.0)
                                      return f"ax:{hit['label'] or hit['title']}", last_diag, last_ax
                                  # Stop waiting early if an error toast or IPC error already occurred.
                                  errs = [x for x in ipc if x.get("state") == "err"]
                                  toasts = last_diag.get("toasts") or []
                                  if errs or any(("실패" in t or "못" in t or "could not" in t.lower() or "failed" in t.lower()) for t in toasts):
                                      return None, last_diag, last_ax
                              return None, last_diag, last_ax

                          print_clicked = click_ui(insp, ['[data-testid="editor-print-btn"]'])
                          trace(f"  Clicked HWP print button: {print_clicked}")
                          print_sheet_kind, hwp_print_diag, ax_nodes_print = wait_native_sheet_presented(insp, wait_s=22.0)
                          trace(f"  HWP print result={print_sheet_kind} diag={hwp_print_diag}")

                          # If HWP print failed (e.g., SVG export error), open seeded PDF and trigger native Print sheet
                          # directly via mobile_print_session_pdf, or Share sheet as final fallback.
                          pdf_print_diag = None
                          if not print_sheet_kind:
                              trace("  HWP print did not present native sheet; trying direct PDF print via seeded PDF document...")
                              try:
                                  if wait_visible(insp, ['[data-testid="editor-back-btn"]'], timeout_s=6.0):
                                      click_ui(insp, ['[data-testid="editor-back-btn"]'])
                                      wait_visible(insp, ['[data-testid="home-recent-list"]'], timeout_s=12.0)
                                  if click_ui(insp, ['[data-testid="home-file-row-open-recent:demo-pdf"]']):
                                      if wait_visible(insp, ['[data-testid="editor-more-btn"]'], timeout_s=15.0):
                                          time.sleep(1.5)
                                          click_ui(insp, ['[data-testid="editor-more-btn"]'])
                                          if wait_visible(insp, ['[data-testid="editor-print-btn"]'], timeout_s=8.0):
                                              insp.eval_js("if (window.__ieumShotDiag) { window.__ieumShotDiag.toasts = []; window.__ieumShotDiag.ipc = []; window.__ieumShotDiag.inFlight = {}; }", timeout_s=10.0)
                                              click_ui(insp, ['[data-testid="editor-print-btn"]'])
                                              print_sheet_kind, pdf_print_diag, ax_nodes_print = wait_native_sheet_presented(insp, wait_s=12.0)
                                              trace(f"  PDF print result={print_sheet_kind} diag={pdf_print_diag}")
                                  if not print_sheet_kind and wait_visible(insp, ['[data-testid="editor-more-btn"]'], timeout_s=4.0):
                                      click_ui(insp, ['[data-testid="editor-more-btn"]'])
                                      if wait_visible(insp, ['[data-testid="editor-sheet-share-btn"]'], timeout_s=6.0):
                                          click_ui(insp, ['[data-testid="editor-sheet-share-btn"]'])
                                          print_sheet_kind, share_diag, ax_nodes_print = wait_native_sheet_presented(insp, wait_s=10.0)
                                          trace(f"  PDF share fallback result={print_sheet_kind} diag={share_diag}")
                              except Exception as exc:
                                  trace(f"  PDF print fallback error: {exc}")

                          s6 = take_shot(udid, out_dir / "06-print-share.png")
                          s6["ready"] = bool(print_sheet_kind)
                          run_info["checks"]["06_print_share"] = {
                              "kind": print_sheet_kind or "not_presented",
                              "hwp_print_diag": hwp_print_diag,
                              "pdf_print_diag": pdf_print_diag,
                              "ax_sample": [
                                  f"{n['type']}[{n['label'] or n['title']!r} @({n['cx']},{n['cy']})]"
                                  for n in ax_nodes_print if (n["label"] or n["title"]) and n["w"] > 0
                              ][:25],
                          }
                          run_info["shots"].append(s6)
                          trace(f"  [SHOT] 06-print-share.png ok={s6['ok']} kind={print_sheet_kind} {s6['width']}x{s6['height']} ct={s6['color_type']}")

                          # Dismiss native Print / Share sheet cleanly so we can return to Home
                          if axe_ready:
                              cancel_btn = find_ax_button(ax_nodes_print, ["취소", "Cancel", "닫기", "Close"])
                              if cancel_btn:
                                  run_cmd(["axe", "tap", "-x", str(cancel_btn["cx"]), "-y", str(cancel_btn["cy"]), "--udid", udid], timeout=15)
                                  trace(f"  Dismissed native sheet via AX button {cancel_btn['label'] or cancel_btn['title']!r} @({cancel_btn['cx']},{cancel_btn['cy']})")
                              elif is_ipad:
                                  run_cmd(["axe", "tap", "-x", "40", "-y", "140", "--udid", udid], timeout=15)
                                  trace("  Dismissed iPad popover via outside tap (40,140)")
                              else:
                                  run_cmd(["axe", "swipe", "--start-x", "210", "--start-y", "110", "--end-x", "210", "--end-y", "820", "--udid", udid], timeout=15)
                                  trace("  Dismissed iPhone sheet via swipe down")
                              time.sleep(2.0)

                          # Return to Home (if native sheet stayed modal or WebInspector paused, relaunch cleanly)
                          back_ok = False
                          try:
                              if wait_visible(insp, ['[data-testid="editor-back-btn"]'], timeout_s=6.0):
                                  click_ui(insp, ['[data-testid="editor-back-btn"]'])
                              back_ok = bool(wait_visible(insp, ['[data-testid="home-fab"]'], timeout_s=10.0))
                          except Exception as exc:
                              trace(f"  Could not navigate back via WebInspector after native sheet: {exc}")

                          if not back_ok:
                              trace("  Relaunching app cleanly to reach Home after native Print sheet")
                              try:
                                  insp.close()
                              except Exception:
                                  pass
                              run_cmd(["xcrun", "simctl", "terminate", udid, bundle_id], timeout=15)
                              time.sleep(1.5)
                              launch_app_once()
                              time.sleep(3.5)
                              insp = connect_inspector(udid)
                              if not insp:
                                  raise RuntimeError("WebInspector failed to reconnect after relaunch")
                              install_shot_diag(insp)
                              apply_clean_status_bar(udid)
                              wait_visible(insp, ['[data-testid="home-fab"]'], timeout_s=20.0)
                              # Restore Card Grid view on Home
                              try:
                                  if insp.eval_js("document.querySelector('[data-testid=\"home-recent-list\"]')?.getAttribute('data-view') || ''") != "grid":
                                      click_ui(insp, ['[data-testid="home-view-mode-btn"]'])
                                      time.sleep(1.0)
                              except Exception:
                                  pass

                          dismiss_tips_and_check_clean(insp, wait_toast_s=5.0)
                          time.sleep(0.8)

                          # Scene 4: [+] Create sheet (verify last button is not clipped)
                          click_ui(insp, ['[data-testid="home-fab"]'])
                          create_ok = bool(wait_visible(insp, ['[data-testid="home-create-sheet"]'], timeout_s=10.0))
                          time.sleep(1.2)
                          sheet_metrics = insp.eval_js("""(() => {
                            const sheet = document.querySelector('[data-testid="home-create-sheet"]');
                            const lastBtn = document.querySelector('[data-testid="home-create-add-folder"]')
                              || Array.from(document.querySelectorAll('.home-frame-create-action')).slice(-1)[0];
                            const sr = sheet ? sheet.getBoundingClientRect() : null;
                            const lr = lastBtn ? lastBtn.getBoundingClientRect() : null;
                            return {
                              innerH: window.innerHeight,
                              sheetTop: sr ? Math.round(sr.top) : null,
                              sheetBottom: sr ? Math.round(sr.bottom) : null,
                              lastBtnId: lastBtn ? lastBtn.getAttribute('data-testid') : null,
                              lastBtnBottom: lr ? Math.round(lr.bottom) : null,
                              clipped: lr ? lr.bottom > window.innerHeight - 2 : null,
                            };
                          })()""")
                          run_info["checks"]["04_create_sheet"] = sheet_metrics
                          trace(f"  04-create-sheet metrics={sheet_metrics}")
                          s4 = take_shot(udid, out_dir / "04-create-sheet.png")
                          s4["ready"] = create_ok and not (sheet_metrics or {}).get("clipped")
                          run_info["shots"].append(s4)
                          trace(f"  [SHOT] 04-create-sheet.png ok={s4['ok']} ready={s4['ready']} {s4['width']}x{s4['height']} ct={s4['color_type']}")

                          # Close [+] Create sheet before opening seeded Markdown note
                          click_ui(insp, ['[data-testid="home-create-sheet"] header button'])
                          time.sleep(0.8)

                          # Scene 7: Markdown Editing (open seeded localized note -> Edit mode, zero tip bubbles)
                          opened_md = click_ui(insp, ['[data-testid="home-file-row-open-recent:demo-md"]'])
                          trace(f"  Opened seeded MD via: {opened_md}")
                          md_ok = False
                          if opened_md and wait_visible(insp, ['[data-testid="editor-mode-toggle"]'], timeout_s=15.0):
                              click_ui(insp, ['[data-testid="editor-mode-toggle"]'])
                              md_ok = bool(wait_visible(insp, ['[data-testid="markdown-editor-textarea"]'], timeout_s=15.0))
                          if not md_ok:
                              # Fallback via [+] -> New Markdown
                              click_ui(insp, ['[data-testid="home-fab"]'])
                              if wait_visible(insp, ['[data-testid="home-create-md"]'], timeout_s=8.0):
                                  click_ui(insp, ['[data-testid="home-create-md"]'])
                                  md_ok = bool(wait_visible(insp, ['[data-testid="markdown-editor-textarea"]'], timeout_s=15.0))
                                  if md_ok:
                                      sample_md = MD_SAMPLE[loc_tag]
                                      insp.eval_js(f"""(() => {{
                                        const ta = document.querySelector('[data-testid="markdown-editor-textarea"]');
                                        if (!ta) return false;
                                        const setter = Object.getOwnPropertyDescriptor(window.HTMLTextAreaElement.prototype, 'value').set;
                                        setter.call(ta, {json.dumps(sample_md, ensure_ascii=False)});
                                        ta.dispatchEvent(new Event('input', {{ bubbles: true }}));
                                        return true;
                                      }})()""")
                          if md_ok:
                              insp.eval_js("document.querySelector('[data-testid=\"markdown-editor-textarea\"]')?.blur();")
                          clean7 = dismiss_tips_and_check_clean(insp)
                          run_info["checks"]["07_markdown_clean"] = clean7
                          time.sleep(1.8)
                          s7 = take_shot(udid, out_dir / "07-markdown-edit.png")
                          s7["ready"] = md_ok and not clean7.get("tip")
                          run_info["shots"].append(s7)
                          trace(f"  [SHOT] 07-markdown-edit.png ok={s7['ok']} ready={s7['ready']} {s7['width']}x{s7['height']} ct={s7['color_type']}")

                          # Return to Home from Markdown editor
                          click_ui(insp, ['[data-testid="editor-back-btn"]'])
                          time.sleep(0.8)
                          if wait_visible(insp, [], ["저장 안 함", "Discard"], timeout_s=2.5, poll_s=0.4):
                              click_ui(insp, [], ["저장 안 함", "Discard"])
                          wait_visible(insp, ['[data-testid="home-recent-list"]', '[data-testid="home-fab"]'], timeout_s=12.0)

                          # Scene 8: Dark Mode Home (recent docs + thumbnails in dark theme, clean 9:41)
                          run_cmd(["xcrun", "simctl", "ui", udid, "appearance", "dark"], timeout=15)
                          apply_clean_status_bar(udid)
                          time.sleep(2.2)
                          bg_dark = str(insp.eval_js("window.getComputedStyle(document.body).backgroundColor || ''") or "")
                          trace(f"  Dark Home body backgroundColor = {bg_dark}")
                          if "255, 255, 255" in bg_dark or "248, 250, 252" in bg_dark:
                              trace("  Switching theme to dark explicitly via Settings...")
                              click_ui(insp, ['[data-testid="home-tab-settings"]', '[data-testid="home-settings-btn"]'])
                              if wait_visible(insp, ['[data-testid="settings-theme-select"]'], timeout_s=10.0):
                                  insp.eval_js("""(() => {
                                    const sel = document.querySelector('[data-testid="settings-theme-select"]');
                                    if (!sel) return false;
                                    const setter = Object.getOwnPropertyDescriptor(window.HTMLSelectElement.prototype, 'value').set;
                                    setter.call(sel, 'dark');
                                    sel.dispatchEvent(new Event('change', { bubbles: true }));
                                    return true;
                                  })()""")
                                  time.sleep(1.0)
                              click_ui(insp, ['[data-testid="settings-back-btn"]', 'header button'], ["뒤로", "Back"])
                              wait_visible(insp, ['[data-testid="home-recent-list"]'], timeout_s=12.0)
                              bg_dark = str(insp.eval_js("window.getComputedStyle(document.body).backgroundColor || ''") or "")
                          if insp.eval_js("document.querySelector('[data-testid=\"home-recent-list\"]')?.getAttribute('data-view') || ''") != "grid":
                              click_ui(insp, ['[data-testid="home-view-mode-btn"]'])
                              time.sleep(1.0)
                          clean8 = dismiss_tips_and_check_clean(insp)
                          apply_clean_status_bar(udid)
                          time.sleep(1.5)
                          run_info["checks"]["08_dark_home"] = {"bg": bg_dark, "clean": clean8}
                          s8 = take_shot(udid, out_dir / "08-dark-home.png")
                          s8["ready"] = ("255, 255, 255" not in bg_dark) and not clean8.get("tip") and not clean8.get("toast")
                          run_info["shots"].append(s8)
                          trace(f"  [SHOT] 08-dark-home.png ok={s8['ok']} ready={s8['ready']} {s8['width']}x{s8['height']} ct={s8['color_type']} bg={bg_dark}")
                      except Exception as exc:
                          trace(f"  [ERROR] Exception during capture: {exc}")
                          run_info["errors"].append(str(exc))
                      finally:
                          # Capture native iOS app logs for this locale (Print/Share/Thumbnail diagnostics)
                          _, log_out, _ = run_cmd([
                              "xcrun", "simctl", "spawn", udid, "log", "show", "--last", "4m", "--style", "compact",
                              "--predicate", 'processImagePath CONTAINS "IeumOffice" OR subsystem BEGINSWITH "com.ieumoffice"',
                          ], timeout=25)
                          if log_out:
                              (logs_dir / f"store-sim-{dev_key}-{loc_tag}.txt").write_text(log_out[-120000:], encoding="utf-8")
                          try:
                              insp.close()
                          except Exception:
                              pass
                          run_cmd(["xcrun", "simctl", "terminate", udid, bundle_id], timeout=15)

                      # Order shots 01..08 in summary
                      run_info["shots"].sort(key=lambda x: x["file"])
                      report["runs"].append(run_info)
              finally:
                  run_cmd(["xcrun", "simctl", "status_bar", udid, "clear"], timeout=15)
                  run_cmd(["xcrun", "simctl", "shutdown", udid], timeout=30)

          (shots_root / "summary.json").write_text(json.dumps(report, ensure_ascii=False, indent=2), encoding="utf-8")
          (logs_dir / "store-shots-trace.txt").write_text("\n".join(trace_lines) + "\n", encoding="utf-8")
          summary_lines = []
          for r in report["runs"]:
              summary_lines.append(f"=== {r['device_key']} ({r['device_name']}, {r['runtime']}) / {r['locale']} ===")
              for s in r["shots"]:
                  summary_lines.append(
                      f"  - {s['file']}: ok={s['ok']} ready={s.get('ready', True)} dims={s['width']}x{s['height']} colorType={s.get('color_type')}"
                  )
              if r["errors"]:
                  summary_lines.append(f"  ERRORS: {r['errors']}")
          (shots_root / "summary.txt").write_text("\n".join(summary_lines) + "\n", encoding="utf-8")
          print("\n".join(summary_lines), flush=True)
          PY

      - name: Upload iOS Store screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ieumoffice-mobile-ios-store-shots
          path: ${{ runner.temp }}/ios-sim-artifacts/store-shots
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload iOS Simulator artifacts (screenshots, logs, .app zip)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ieumoffice-mobile-ios-sim
          path: ${{ runner.temp }}/ios-sim-artifacts
          retention-days: 7
          if-no-files-found: warn
