          def wait_visible(insp, selectors, labels=(), timeout_s=20.0, poll_s=0.6):
              deadline = time.time() + timeout_s
              while time.time() < deadline:
                  try:
                      found = insp.eval_js(f"""(() => {{
                        const sels = {json.dumps(list(selectors))};
                        const lbls = {json.dumps(list(labels), ensure_ascii=False)};
                        const vis = (el) => {{
                          const r = el.getBoundingClientRect();
                          if (!r || r.width <= 0 || r.height <= 0) return false;
                          const st = window.getComputedStyle(el);
                          return st.display !== 'none' && st.visibility !== 'hidden' && st.opacity !== '0';
                        }};
                        for (const s of sels) {{
                          const el = document.querySelector(s);
                          if (el && vis(el)) return 'sel:' + s;
                        }}
                        if (lbls.length) {{
                          for (const el of document.querySelectorAll('button, [role="button"], a')) {{
                            if (!vis(el)) continue;
                            const al = (el.getAttribute('aria-label') || '').trim();
                            const tx = (el.innerText || el.textContent || '').trim();
                            if (lbls.some(l => al === l || tx === l)) return 'lbl:' + (al || tx);
                          }}
                        }}
                        return null;
                      }})()""")
                      if found:
                          return found
                  except Exception:
                      pass
                  time.sleep(poll_s)
              return None

          def click_ui(insp, selectors, labels=()):
