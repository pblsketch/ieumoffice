          def png_meta(path):
              try:
                  raw = Path(path).read_bytes()
                  if len(raw) >= 26 and raw[:8] == b"\x89PNG\r\n\x1a\n":
                      w, h, bit_depth, color_type = struct.unpack(">IIBB", raw[16:26])
                      return w, h, color_type
              except Exception:
                  pass
              return None, None, None

          def take_shot(udid, out_path):
              last_err = ""
              for attempt in range(1, 4):
                  rc, _, err = run_cmd(["xcrun", "simctl", "io", udid, "screenshot", str(out_path)], timeout=45)
                  if rc == 0 and out_path.exists() and out_path.stat().st_size > 1024:
                      rc_s, _, err_s = run_cmd([strip_alpha_bin, str(out_path)], timeout=20)
                      if rc_s != 0:
                          trace(f"  [WARN] strip-png-alpha failed on {out_path.name}: {err_s.strip()}")
                      w, h, ct = png_meta(out_path)
                      return {
                          "file": out_path.name,
                          "ok": True,
                          "width": w,
                          "height": h,
                          "color_type": ct,
                          "error": "",
                      }
                  last_err = err.strip()
                  trace(f"  screenshot {out_path.name} attempt {attempt} failed (rc={rc}): {last_err[:120]}")
                  time.sleep(2.0)
              return {"file": out_path.name, "ok": False, "width": None, "height": None, "color_type": None, "error": last_err}

          def describe_ax_nodes(udid):
              if not axe_ready:
                  return []
              rc, out, _ = run_cmd(["axe", "describe-ui", "--udid", udid], timeout=15)
              if rc != 0 or not out.strip():
                  return []
              try:
                  tree = json.loads(out)
              except Exception:
                  return []
              nodes = []
              def walk(node):
                  if isinstance(node, list):
                      for item in node:
                          walk(item)
                  elif isinstance(node, dict):
                      frame = node.get("frame") or {}
                      w = float(frame.get("width") or 0)
                      h = float(frame.get("height") or 0)
                      x = float(frame.get("x") or 0)
                      y = float(frame.get("y") or 0)
                      nodes.append({
                          "label": str(node.get("AXLabel") or ""),
                          "title": str(node.get("AXTitle") or ""),
                          "uid": str(node.get("AXUniqueId") or ""),
                          "type": str(node.get("type") or node.get("role") or ""),
                          "enabled": node.get("enabled", node.get("AXEnabled", True)) is not False,
                          "w": w, "h": h,
                          "cx": int(round(x + w / 2.0)),
                          "cy": int(round(y + h / 2.0)),
                      })
                      for ch in (node.get("children") or []):
                          walk(ch)
              walk(tree)
              return nodes

          def find_ax_button(nodes, keywords):
              for kw in keywords:
                  kw_l = kw.lower()
                  for n in nodes:
                      if not n["enabled"] or n["w"] <= 0 or n["h"] <= 0:
                          continue
                      texts = [n["label"].strip().lower(), n["title"].strip().lower(), n["uid"].strip().lower()]
                      if kw_l in texts:
                          return n
              for kw in keywords:
                  kw_l = kw.lower()
                  for n in nodes:
                      if not n["enabled"] or n["w"] <= 0 or n["h"] <= 0:
                          continue
                      hay = f"{n['label']} {n['title']} {n['uid']}".lower()
                      if kw_l in hay:
                          return n
              return None

          # --- Synthetic clean sample file builders (no PII, no third-party brands) ---

          def make_rgb_png(width, height, pixels_rgb):
              def chunk(tag, data):
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", zlib.crc32(tag + data) & 0xFFFFFFFF)
              raw_rows = bytearray()
              stride = width * 3
              for y in range(height):
                  raw_rows.append(0)
                  raw_rows.extend(pixels_rgb[y * stride : (y + 1) * stride])
              ihdr = struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0)
              return b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(bytes(raw_rows), 6)) + chunk(b"IEND", b"")

          def build_spreadsheet_thumb_png():
              w, h = 240, 180
              buf = bytearray([255, 255, 255] * (w * h))
              def fill(x0, y0, x1, y1, rgb):
                  r, g, b = rgb
                  for y in range(max(0, y0), min(h, y1)):
                      off = (y * w + max(0, x0)) * 3
                      for _ in range(max(0, x0), min(w, x1)):
                          buf[off] = r
                          buf[off + 1] = g
                          buf[off + 2] = b
                          off += 3
              # Clean spreadsheet top banner + header row + grid + chart bars
              fill(0, 0, w, 26, (22, 163, 74))
              fill(14, 9, 108, 17, (255, 255, 255))
              fill(12, 34, 228, 50, (240, 253, 244))
              for row in range(6):
                  ry = 50 + row * 16
                  fill(12, ry, 228, ry + 1, (226, 232, 240))
                  if row < 5:
                      fill(18, ry + 5, 74, ry + 11, (100, 116, 139))
                      fill(96, ry + 5, 136 + (row * 9) % 24, ry + 11, (71, 85, 105))
                      fill(176, ry + 5, 218, ry + 11, (22, 163, 74))
              for cx in (12, 86, 162, 228):
                  fill(cx, 34, cx + 1, 130, (226, 232, 240))
              # Mini summary bars at bottom
              bar_heights = (20, 30, 24, 34, 28, 38)
              for idx, bh in enumerate(bar_heights):
                  bx = 22 + idx * 32
                  fill(bx, 170 - bh, bx + 18, 170, (34, 197, 94) if idx % 2 == 0 else (16, 185, 129))
              return make_rgb_png(w, h, bytes(buf))

          def build_clean_pdf(title_ascii, subtitle_ascii, rows):
              # Build a clean single-page PDF 1.4 with vector header, table, and chart
              # so iOS PDFKit renders a crisp visual thumbnail on Home.
              cmds = [
                  "q",
                  "0.11 0.31 0.62 rg",
                  "0 740 595 102 re f",
                  "1 1 1 rg",
                  "BT /F2 22 Tf 44 794 Td (" + title_ascii + ") Tj ET",
                  "0.84 0.91 0.99 rg",
                  "BT /F1 11 Tf 44 766 Td (" + subtitle_ascii + ") Tj ET",
                  "0.95 0.97 1.00 rg",
                  "44 646 507 66 re f",
                  "0.12 0.16 0.23 rg",
                  "BT /F2 13 Tf 60 686 Td (Executive Summary) Tj ET",
                  "0.30 0.35 0.44 rg",
                  "BT /F1 10.5 Tf 60 666 Td (Unified mobile office workspace for documents, spreadsheets, PDFs, and notes.) Tj ET",
                  "0.11 0.31 0.62 rg",
                  "44 596 507 26 re f",
                  "1 1 1 rg",
                  "BT /F2 10.5 Tf 58 605 Td (Category) Tj 210 0 Td (Status) Tj 130 0 Td (Progress) Tj ET",
              ]
              y = 568
              for i, (col1, col2, col3) in enumerate(rows):
                  if i % 2 == 0:
                      cmds.append(f"0.97 0.98 0.99 rg 44 {y - 8} 507 26 re f")
                  cmds.append("0.15 0.20 0.28 rg")
                  cmds.append(f"BT /F1 10.5 Tf 58 {y} Td ({col1}) Tj 210 0 Td ({col2}) Tj 130 0 Td ({col3}) Tj ET")
                  cmds.append(f"0.86 0.89 0.93 RG 0.6 w 44 {y - 8} m 551 {y - 8} l S")
                  y -= 28
              # Clean bar chart block
              cmds.append("0.12 0.16 0.23 rg BT /F2 13 Tf 44 398 Td (Quarterly Highlights) Tj ET")
              bars = [(70, 95), (140, 130), (210, 112), (280, 152), (350, 138), (420, 168)]
              for idx, (bx, bh) in enumerate(bars):
                  color = "0.15 0.39 0.92 rg" if idx % 2 == 0 else "0.23 0.51 0.96 rg"
                  cmds.append(f"{color} {bx} 186 40 {bh} re f")
              cmds.append("0.80 0.84 0.90 RG 1 w 44 186 m 520 186 l S")
              cmds.append("Q")
              stream = "\n".join(cmds).encode("ascii")

              objs = [
                  b"1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj\n",
                  b"2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj\n",
                  b"3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Resources << /Font << /F1 4 0 R /F2 5 0 R >> >> /Contents 6 0 R >> endobj\n",
                  b"4 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj\n",
                  b"5 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold >> endobj\n",
                  b"6 0 obj << /Length " + str(len(stream)).encode("ascii") + b" >> stream\n" + stream + b"\nendstream endobj\n",
              ]
              out = bytearray(b"%PDF-1.4\n")
              offsets = [0]
              for obj in objs:
                  offsets.append(len(out))
                  out.extend(obj)
              xref_pos = len(out)
              out.extend(f"xref\n0 {len(offsets)}\n0000000000 65535 f \n".encode("ascii"))
              for off in offsets[1:]:
                  out.extend(f"{off:010d} 00000 n \n".encode("ascii"))
              out.extend(f"trailer << /Size {len(offsets)} /Root 1 0 R >>\nstartxref\n{xref_pos}\n%%EOF\n".encode("ascii"))
              return bytes(out)

