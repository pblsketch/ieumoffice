                  # Final sanity check: return to Home (if in opened md) and open Settings
                  if opened_saved_md:
                      el_b = wait_for_element(insp, "10-find-back", ['[data-testid="editor-back-btn"]'], ["뒤로", "Back"], timeout_s=5.0)
                      if el_b:
                          tap_element(insp, el_b, ['[data-testid="editor-back-btn"]'], ["뒤로", "Back"])
                          time.sleep(1.5)
                  el_settings = wait_for_element(
