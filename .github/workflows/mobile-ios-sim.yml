name: Mobile iOS Simulator

# Phase 1 iOS Simulator verification on GitHub-hosted macOS (Apple Silicon, no AI):
# builds an unsigned Debug .app for iphonesimulator (arm64, inspectable WebView),
# boots a ko-KR iPhone Simulator, runs a deterministic AXe UI walk-through, and
# uploads screenshots, logs, memory snapshots, and the zipped .app artifact.

on:
  push:
    branches:
      - 'ci/mobile-ios-sim'
  workflow_dispatch:

concurrency:
  group: mobile-ios-sim-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ios-sim-smoke:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Mobile v1 Vite bundle (Univer, PDF.js, Tiptap, Mermaid, Konva) exceeds
      # Node's default 2 GB heap cap on macos-latest arm64 runners.
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (iOS Simulator arm64)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: aarch64-apple-ios-sim,aarch64-apple-ios

      - name: Cache cargo (iOS Simulator)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          key: ios-sim
          cache-on-failure: true
          workspaces: |
            apps/mobile/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build rhwp studio and mobile web bundle
        run: |
          npm run studio -w @genoffice/hwp
          npm run build -w @genoffice/mobile
          test -f apps/mobile/dist/studio/index.html

      - name: Initialize iOS project and inject native config
        working-directory: apps/mobile
        run: |
          npx --yes @tauri-apps/cli@2 ios init --ci
          node scripts/apply-native-config.mjs ios
          ls -la src-tauri/gen/apple

      - name: Build unsigned Debug iOS Simulator .app
        id: build_sim
        working-directory: apps/mobile
        run: |
          set -euo pipefail
          ART_DIR="$RUNNER_TEMP/ios-sim-artifacts"
          mkdir -p "$ART_DIR/screenshots" "$ART_DIR/logs"
          echo "art_dir=$ART_DIR" >> "$GITHUB_OUTPUT"

          echo "=== Environment info ===" | tee "$ART_DIR/logs/build-env.txt"
          xcodebuild -version | tee -a "$ART_DIR/logs/build-env.txt"
          rustc --version | tee -a "$ART_DIR/logs/build-env.txt"
          node --version | tee -a "$ART_DIR/logs/build-env.txt"
          npx --yes @tauri-apps/cli@2 ios build --help | tee -a "$ART_DIR/logs/build-env.txt" || true

          # Build Debug for iphonesimulator arm64 without code signing via Tauri CLI.
          # Tauri CLI starts its cli-options-server for the Xcode "Build Rust Code" phase,
          # compiles Rust + Swift plugin for aarch64-apple-ios-sim in debug mode (so
          # debug_assertions enables WKWebView.isInspectable = true), and skips signing.
          npx --yes @tauri-apps/cli@2 ios build \
            --debug \
            --target aarch64-sim \
            --no-sign \
            --ci \
            -c '{"build":{"beforeBuildCommand":""}}' \
            -v 2>&1 | tee "$ART_DIR/logs/tauri-ios-build.log"

          echo "=== Searching for built .app ==="
          find src-tauri/gen/apple/build -maxdepth 5 2>/dev/null || true
          APP_PATH=$(find src-tauri/gen/apple/build -name "*.app" -type d 2>/dev/null | head -n 1 || true)
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find "$HOME/Library/Developer/Xcode/DerivedData" -path "*iphonesimulator*" -name "*.app" -type d 2>/dev/null | head -n 1 || true)
          fi
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Built .app not found under src-tauri/gen/apple/build or DerivedData" >&2
            exit 1
          fi

          APP_PATH="$(cd "$(dirname "$APP_PATH")" && pwd)/$(basename "$APP_PATH")"
          APP_NAME=$(basename "$APP_PATH")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP_PATH/Info.plist")
          echo "Built .app: $APP_PATH (bundle id: $BUNDLE_ID)"
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "app_name=$APP_NAME" >> "$GITHUB_OUTPUT"
          echo "bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"

          # Package the .app as a zip artifact (preserving symlinks and bundle structure).
          (cd "$(dirname "$APP_PATH")" && zip -ry "$ART_DIR/IeumOffice-ios-sim.app.zip" "$APP_NAME" > /dev/null)
          ls -lh "$ART_DIR/IeumOffice-ios-sim.app.zip"

      - name: Install AXe CLI for simulator accessibility automation
        id: install_axe
        run: |
          set -euo pipefail
          if brew install cameroncooke/axe/axe; then
            axe --version || true
            echo "axe_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "AXe installation failed; will still boot simulator and capture launch screenshot."
            echo "axe_ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Boot iPhone Simulator (ko-KR) and run deterministic UI walk-through
        id: sim_smoke
        env:
          ART_DIR: ${{ steps.build_sim.outputs.art_dir }}
          APP_PATH: ${{ steps.build_sim.outputs.app_path }}
          BUNDLE_ID: ${{ steps.build_sim.outputs.bundle_id }}
          AXE_READY: ${{ steps.install_axe.outputs.axe_ready }}
        run: |
          set -euo pipefail

          # Pick the newest available iPhone simulator on this runner.
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          candidates = []
          for runtime, devices in data.get('devices', {}).items():
              if 'iOS' not in runtime:
                  continue
              for d in devices:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      candidates.append((runtime, d['name'], d['udid']))
          if not candidates:
              sys.exit(1)
          # Prefer latest runtime and standard iPhone models (16/15/etc., avoid SE if larger exists).
          def score(item):
              rt, name, _ = item
              non_se = 0 if 'SE' in name else 1
              non_mini = 0 if 'mini' in name else 1
              return (rt, non_se, non_mini, name)
          candidates.sort(key=score)
          chosen = candidates[-1]
          print(f'Selected simulator: {chosen[1]} ({chosen[0]}) -> {chosen[2]}', file=sys.stderr)
          print(chosen[2])
          ")

          echo "Booting simulator $UDID..."
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

          # Set Korean locale, enable WKWebView accessibility tree exposure for AXe,
          # and forward WebKit page console messages to the unified simulator log.
          xcrun simctl spawn "$UDID" defaults write -g AppleLanguages -array "ko-KR" "ko" "en" || true
          xcrun simctl spawn "$UDID" defaults write -g AppleLocale -string "ko_KR" || true
          xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility ApplicationAccessibilityEnabled -bool true || true
          xcrun simctl spawn "$UDID" defaults write com.apple.Accessibility AccessibilityEnabled -bool true || true
          xcrun simctl spawn "$UDID" defaults write com.ieumoffice.mobile WebKitDebugLogsPageMessagesToSystemConsoleEnabled -bool true || true
          xcrun simctl spawn "$UDID" defaults write com.ieumoffice.mobile WebKit2LogsPageMessagesToSystemConsoleEnabled -bool true || true
          xcrun simctl ui "$UDID" appearance light || true

          # Install the built .app.
          xcrun simctl install "$UDID" "$APP_PATH"

          # Start unified simulator log stream in the background.
          LOG_STREAM="$ART_DIR/logs/sim-log-stream.txt"
          xcrun simctl spawn "$UDID" log stream --style compact --level debug \
            --predicate 'processImagePath CONTAINS "IeumOffice" OR process CONTAINS "WebContent" OR subsystem BEGINSWITH "com.ieumoffice" OR subsystem == "com.apple.WebKit"' \
            > "$LOG_STREAM" 2>&1 &
          LOG_PID=$!

          cleanup_sim() {
            kill "$LOG_PID" 2>/dev/null || true
            xcrun simctl spawn "$UDID" log show --last 10m --style compact \
              --predicate 'processImagePath CONTAINS "IeumOffice" OR process CONTAINS "WebContent" OR subsystem BEGINSWITH "com.ieumoffice"' \
              > "$ART_DIR/logs/sim-log-show.txt" 2>&1 || true
            # Collect crash reports if any were generated during the run.
            if [ -d "$HOME/Library/Logs/DiagnosticReports" ]; then
              find "$HOME/Library/Logs/DiagnosticReports" -maxdepth 2 \( -name "*IeumOffice*" -o -name "*WebContent*" \) \
                -exec cp {} "$ART_DIR/logs/" \; 2>/dev/null || true
            fi
            xcrun simctl shutdown "$UDID" 2>/dev/null || true
          }
          trap cleanup_sim EXIT

          # Launch the app with Korean locale arguments and capture stdout/stderr.
          LAUNCH_OUT=$(xcrun simctl launch \
            --stdout="$ART_DIR/logs/app-stdout.txt" \
            --stderr="$ART_DIR/logs/app-stderr.txt" \
            "$UDID" "$BUNDLE_ID" \
            -AppleLanguages "(ko-KR)" -AppleLocale "ko_KR")
          echo "Launch output: $LAUNCH_OUT" | tee "$ART_DIR/logs/launch.txt"
          APP_PID=$(echo "$LAUNCH_OUT" | awk '{print $NF}')

          # Run deterministic UI walk-through using iOS Simulator Web Inspector
          # (com.apple.webinspectord_sim.socket) for DOM inspection + element coordinates
          # and AXe (`axe tap`) for real simulator touch input, plus simctl screenshots.
          UDID="$UDID" APP_PID="$APP_PID" BUNDLE_ID="$BUNDLE_ID" python3 - <<'PY'
          import glob
          import json
          import os
          import plistlib
          import socket
          import struct
          import subprocess
          import sys
          import time
          import uuid
          from pathlib import Path

          udid = os.environ["UDID"]
          art_dir = Path(os.environ["ART_DIR"])
          shots_dir = art_dir / "screenshots"
          logs_dir = art_dir / "logs"
          axe_ready = os.environ.get("AXE_READY") == "true"
          app_pid = os.environ.get("APP_PID", "")
          bundle_id = os.environ.get("BUNDLE_ID", "com.ieumoffice.mobile")

          trace_lines = []
          def trace(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              trace_lines.append(line)
              print(line, flush=True)

          summary = {
              "udid": udid,
              "app_pid": app_pid,
              "axe_ready": axe_ready,
              "inspector_connected": False,
              "steps": [],
              "stuck_at": None,
              "stuck_reason": None,
              "memory_samples": [],
              "webview_console_errors": [],
          }

          def run_cmd(cmd, timeout=30):
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)
                  return p.returncode, p.stdout, p.stderr
              except Exception as exc:
                  return -1, "", str(exc)

          def screenshot(name):
              out = shots_dir / name
              rc, _, err = run_cmd(["xcrun", "simctl", "io", udid, "screenshot", str(out)])
              return {"file": name, "ok": rc == 0 and out.exists(), "error": err.strip() if rc != 0 else ""}

          def record_memory(label):
              rc, out, _ = run_cmd(["ps", "-axo", "pid,ppid,rss,vsz,comm"])
              rows = []
              web_pids = []
              if rc == 0:
                  for line in out.splitlines():
                      if any(k in line for k in ("IeumOffice", "WebContent", "Networking", "GPU")):
                          if "grep" not in line:
                              s = line.strip()
                              rows.append(s)
                              if "WebContent" in s:
                                  parts = s.split()
                                  if parts and parts[0].isdigit():
                                      web_pids.append(parts[0])
              sample = {"label": label, "time": time.strftime("%H:%M:%S"), "ps": rows}
              if app_pid.isdigit():
                  rc_fp, out_fp, _ = run_cmd(["footprint", "-p", app_pid], timeout=15)
                  if rc_fp == 0:
                      sample["footprint_head"] = "\n".join(out_fp.splitlines()[:20])
              if web_pids:
                  rc_wfp, out_wfp, _ = run_cmd(["footprint", "-p", web_pids[0]], timeout=15)
                  if rc_wfp == 0:
                      sample["webcontent_footprint_head"] = "\n".join(out_wfp.splitlines()[:20])
              summary["memory_samples"].append(sample)

          def find_webinspectord_socket():
              candidates = []
              rc, out, _ = run_cmd(["xcrun", "simctl", "getenv", udid, "RWI_LISTEN_SOCKET"], timeout=10)
              if rc == 0 and out.strip():
                  candidates.append(out.strip())
              rc2, out2, _ = run_cmd(["lsof", "-aUc", "launchd_sim"], timeout=10)
              if rc2 == 0:
                  for line in out2.splitlines():
                      if "webinspectord_sim.socket" in line:
                          parts = line.split()
                          if parts:
                              candidates.append(parts[-1])
              for pat in (
                  "/private/tmp/com.apple.launchd.*/com.apple.webinspectord_sim.socket",
                  "/private/var/tmp/com.apple.launchd.*/com.apple.webinspectord_sim.socket",
              ):
                  candidates.extend(glob.glob(pat))
              seen = []
              for c in candidates:
                  if c and os.path.exists(c) and c not in seen:
                      seen.append(c)
              trace(f"WebInspector socket candidates: {seen}")
              return seen

          class WebInspectorClient:
              def __init__(self, sock_path):
                  self.sock_path = sock_path
                  self.sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  self.sock.settimeout(5.0)
                  self.sock.connect(sock_path)
                  self.conn_id = str(uuid.uuid4()).upper()
                  self.sender_id = str(uuid.uuid4()).upper()
                  self.app_id = None
                  self.page_id = None
                  self.target_id = None
                  self.next_id = 1
                  self.console_events = []

              def close(self):
                  try:
                      self.sock.close()
                  except Exception:
                      pass

              def _recv_exact(self, n):
                  buf = bytearray()
                  while len(buf) < n:
                      chunk = self.sock.recv(n - len(buf))
                      if not chunk:
                          raise EOFError("WebInspector socket closed")
                      buf.extend(chunk)
                  return bytes(buf)

              def send_rpc(self, selector, argument):
                  payload = plistlib.dumps(
                      {"__selector": selector, "__argument": argument},
                      fmt=plistlib.FMT_BINARY,
                  )
                  self.sock.sendall(struct.pack(">I", len(payload)) + payload)

              def recv_rpc(self, timeout=5.0):
                  self.sock.settimeout(timeout)
                  hdr = self._recv_exact(4)
                  (length,) = struct.unpack(">I", hdr)
                  body = self._recv_exact(length)
                  return plistlib.loads(body)

              def _match_app(self, app_dict):
                  if not isinstance(app_dict, dict):
                      return None
                  bid = str(app_dict.get("WIRApplicationBundleIdentifierKey") or "")
                  name = str(app_dict.get("WIRApplicationNameKey") or "")
                  aid = str(app_dict.get("WIRApplicationIdentifierKey") or "")
                  if bid == bundle_id or (app_pid and aid == f"PID:{app_pid}") or name == "IeumOffice":
                      return aid
                  return None

              def connect(self, timeout_s=35.0):
                  self.send_rpc("_rpc_reportIdentifier:", {"WIRConnectionIdentifierKey": self.conn_id})
                  deadline = time.time() + timeout_s
                  listing_requested = False
                  socket_setup_sent = False

                  while time.time() < deadline:
                      try:
                          msg = self.recv_rpc(timeout=2.0)
                      except socket.timeout:
                          if self.app_id and not listing_requested:
                              self.send_rpc("_rpc_forwardGetListing:", {
                                  "WIRConnectionIdentifierKey": self.conn_id,
                                  "WIRApplicationIdentifierKey": self.app_id,
                              })
                              listing_requested = True
                          elif socket_setup_sent:
                              # Ready even if Target.targetCreated was not emitted (direct mode).
                              return True
                          continue
                      sel = msg.get("__selector", "")
                      arg = msg.get("__argument", {}) or {}
                      trace(f"RPC <- {sel} keys={list(arg.keys())}")

                      if sel == "_rpc_reportConnectedApplicationList:":
                          apps = arg.get("WIRApplicationDictionaryKey") or {}
                          for k, v in apps.items():
                              trace(f"  app[{k}]: id={v.get('WIRApplicationIdentifierKey')} bundle={v.get('WIRApplicationBundleIdentifierKey')} name={v.get('WIRApplicationNameKey')} proxy={v.get('WIRIsApplicationProxyKey')}")
                              hit = self._match_app(v)
                              if hit:
                                  self.app_id = hit
                      elif sel in ("_rpc_applicationConnected:", "_rpc_applicationUpdated:"):
                          hit = self._match_app(arg)
                          if hit:
                              self.app_id = hit

                      if self.app_id and not listing_requested:
                          trace(f"Requesting listing for app_id={self.app_id}")
                          self.send_rpc("_rpc_forwardGetListing:", {
                              "WIRConnectionIdentifierKey": self.conn_id,
                              "WIRApplicationIdentifierKey": self.app_id,
                          })
                          listing_requested = True

                      if sel == "_rpc_applicationSentListing:":
                          listing = arg.get("WIRListingKey") or {}
                          chosen = None
                          for k, p in listing.items():
                              url = str(p.get("WIRURLKey") or "")
                              ptype = str(p.get("WIRTypeKey") or "")
                              pid_val = p.get("WIRPageIdentifierKey")
                              trace(f"  page[{k}]: id={pid_val} type={ptype} url={url}")
                              if pid_val is not None:
                                  if url.startswith("tauri://"):
                                      chosen = pid_val
                                      break
                                  if chosen is None and ("Web" in ptype or url):
                                      chosen = pid_val
                          if chosen is not None and not socket_setup_sent:
                              self.page_id = chosen
                              trace(f"Sending _rpc_forwardSocketSetup for app={self.app_id} page={self.page_id}")
                              self.send_rpc("_rpc_forwardSocketSetup:", {
                                  "WIRConnectionIdentifierKey": self.conn_id,
                                  "WIRApplicationIdentifierKey": self.app_id,
                                  "WIRPageIdentifierKey": self.page_id,
                                  "WIRSenderKey": self.sender_id,
                                  "WIRAutomaticallyPause": False,
                              })
                              socket_setup_sent = True

                      if sel == "_rpc_applicationSentData:":
                          raw = arg.get("WIRMessageDataKey")
                          if isinstance(raw, (bytes, bytearray)):
                              try:
                                  data = json.loads(raw.decode("utf-8", errors="replace"))
                                  trace(f"  data <- method={data.get('method')} id={data.get('id')}")
                                  if data.get("method") == "Target.targetCreated":
                                      tinfo = (data.get("params") or {}).get("targetInfo") or {}
                                      tid = tinfo.get("targetId")
                                      ttype = tinfo.get("type")
                                      trace(f"  targetCreated: id={tid} type={ttype}")
                                      if tid and (self.target_id is None or ttype == "page"):
                                          self.target_id = tid
                                          return True
                              except Exception as exc:
                                  trace(f"  data parse error: {exc}")

                  return socket_setup_sent

              def eval_js(self, expression, timeout_s=15.0):
                  cmd_id = self.next_id
                  self.next_id += 1
                  inner = {
                      "id": cmd_id,
                      "method": "Runtime.evaluate",
                      "params": {
                          "expression": expression,
                          "returnByValue": True,
                          "awaitPromise": False,
                      },
                  }
                  if self.target_id:
                      outer_id = self.next_id
                      self.next_id += 1
                      payload_obj = {
                          "id": outer_id,
                          "method": "Target.sendMessageToTarget",
                          "params": {
                              "targetId": self.target_id,
                              "message": json.dumps(inner),
                          },
                      }
                  else:
                      payload_obj = inner

                  self.send_rpc("_rpc_forwardSocketData:", {
                      "WIRConnectionIdentifierKey": self.conn_id,
                      "WIRApplicationIdentifierKey": self.app_id,
                      "WIRPageIdentifierKey": self.page_id,
                      "WIRSenderKey": self.sender_id,
                      "WIRSocketDataKey": json.dumps(payload_obj).encode("utf-8"),
                  })

                  deadline = time.time() + timeout_s
                  while time.time() < deadline:
                      try:
                          msg = self.recv_rpc(timeout=max(0.5, deadline - time.time()))
                      except socket.timeout:
                          break
                      sel = msg.get("__selector", "")
                      arg = msg.get("__argument", {}) or {}
                      if sel != "_rpc_applicationSentData:":
                          continue
                      raw = arg.get("WIRMessageDataKey")
                      if not isinstance(raw, (bytes, bytearray)):
                          continue
                      data = json.loads(raw.decode("utf-8", errors="replace"))
                      if data.get("method") == "Target.targetCreated":
                          tinfo = (data.get("params") or {}).get("targetInfo") or {}
                          if tinfo.get("type") == "page" and tinfo.get("targetId"):
                              self.target_id = tinfo["targetId"]
                          continue
                      if data.get("method") == "Target.dispatchMessageFromTarget":
                          inner_str = (data.get("params") or {}).get("message", "")
                          if not inner_str:
                              continue
                          inner_data = json.loads(inner_str)
                          if inner_data.get("id") == cmd_id:
                              return self._unwrap_eval(inner_data)
                          if inner_data.get("method") in ("Console.messageAdded", "Log.entryAdded"):
                              self.console_events.append(inner_data)
                      elif data.get("id") == cmd_id:
                          return self._unwrap_eval(data)
                  raise TimeoutError(f"Runtime.evaluate timed out (cmd_id={cmd_id})")

              def _unwrap_eval(self, resp):
                  if "error" in resp:
                      raise RuntimeError(f"Inspector error: {resp['error']}")
                  res = resp.get("result") or {}
                  if res.get("wasThrown"):
                      raise RuntimeError(f"JS exception: {res.get('result')}")
                  obj = res.get("result") or {}
                  if "value" in obj:
                      return obj["value"]
                  return None

          def connect_inspector():
              for attempt in range(1, 5):
                  socks = find_webinspectord_socket()
                  for sp in socks:
                      try:
                          client = WebInspectorClient(sp)
                          if client.connect(timeout_s=20.0):
                              trace(f"Connected WebInspector: sock={sp} app={client.app_id} page={client.page_id} target={client.target_id}")
                              return client
                          client.close()
                      except Exception as exc:
                          trace(f"WebInspector attempt {attempt} on {sp} failed: {exc}")
                  time.sleep(3)
              return None

          def install_error_hook(insp):
              insp.eval_js("""(() => {
                if (window.__ieumSimErrHooked) return 'already';
                window.__ieumSimErrHooked = true;
                window.__ieumSimErrors = [];
                window.addEventListener('error', (e) => {
                  window.__ieumSimErrors.push({type:'error', msg: String(e.message || e.error || e), src: String(e.filename || ''), line: e.lineno || 0});
                });
                window.addEventListener('unhandledrejection', (e) => {
                  window.__ieumSimErrors.push({type:'rejection', msg: String(e.reason?.stack || e.reason || e)});
                });
                const origErr = console.error.bind(console);
                console.error = (...args) => {
                  window.__ieumSimErrors.push({type:'console.error', msg: args.map(a => typeof a === 'string' ? a : (a?.message || JSON.stringify(a))).join(' ')});
                  return origErr(...args);
                };
                return 'installed';
              })()""")

          def query_element(insp, selectors, labels):
              expr = f"""(() => {{
                const selectors = {json.dumps(selectors)};
                const labels = {json.dumps(labels, ensure_ascii=False)};
                const describe = (el, how) => {{
                  const r = el.getBoundingClientRect();
                  if (!r || r.width <= 0 || r.height <= 0) return null;
                  const style = window.getComputedStyle(el);
                  if (style.display === 'none' || style.visibility === 'hidden' || style.opacity === '0') return null;
                  return {{
                    found: true,
                    how,
                    tag: el.tagName,
                    testId: el.getAttribute('data-testid') || '',
                    ariaLabel: el.getAttribute('aria-label') || '',
                    text: (el.innerText || el.textContent || '').trim().slice(0, 80),
                    x: r.left, y: r.top, width: r.width, height: r.height,
                    cx: Math.round(r.left + r.width / 2),
                    cy: Math.round(r.top + r.height / 2),
                  }};
                }};
                for (const sel of selectors) {{
                  const el = document.querySelector(sel);
                  if (el) {{
                    const info = describe(el, 'selector:' + sel);
                    if (info) return info;
                  }}
                }}
                const clickables = Array.from(document.querySelectorAll('button, [role="button"], a'));
                for (const lbl of labels) {{
                  for (const el of clickables) {{
                    const al = (el.getAttribute('aria-label') || '').trim();
                    const tx = (el.innerText || el.textContent || '').trim();
                    if (al === lbl || tx === lbl || tx.includes(lbl) || al.includes(lbl)) {{
                      const info = describe(el, 'label:' + lbl);
                      if (info) return info;
                    }}
                  }}
                }}
                return {{
                  found: false,
                  lang: document.documentElement.lang || navigator.language,
                  vw: window.innerWidth, vh: window.innerHeight,
                  buttons: clickables.slice(0, 25).map(el => ({{
                    testId: el.getAttribute('data-testid') || '',
                    aria: el.getAttribute('aria-label') || '',
                    text: (el.innerText || el.textContent || '').trim().slice(0, 40),
                  }})),
                }};
              }})()"""
              return insp.eval_js(expr)

          def click_element_js(insp, selectors, labels):
              expr = f"""(() => {{
                const selectors = {json.dumps(selectors)};
                const labels = {json.dumps(labels, ensure_ascii=False)};
                for (const sel of selectors) {{
                  const el = document.querySelector(sel);
                  if (el) {{ el.click(); return 'clicked:' + sel; }}
                }}
                const clickables = Array.from(document.querySelectorAll('button, [role="button"], a'));
                for (const lbl of labels) {{
                  for (const el of clickables) {{
                    const al = (el.getAttribute('aria-label') || '').trim();
                    const tx = (el.innerText || el.textContent || '').trim();
                    if (al === lbl || tx === lbl || tx.includes(lbl) || al.includes(lbl)) {{
                      el.click();
                      return 'clicked:' + lbl;
                    }}
                  }}
                }}
                return 'not-found';
              }})()"""
              return insp.eval_js(expr)

          def wait_for_element(insp, tag, selectors, labels, timeout_s=25.0, poll_s=1.0):
              deadline = time.time() + timeout_s
              last = None
              while time.time() < deadline:
                  try:
                      info = query_element(insp, selectors, labels)
                      last = info
                      if isinstance(info, dict) and info.get("found"):
                          return info
                  except Exception as exc:
                      last = {"error": str(exc)}
                  time.sleep(poll_s)
              (logs_dir / f"dom-{tag}.json").write_text(json.dumps(last, ensure_ascii=False, indent=2), encoding="utf-8")
              return None

          def tap_element(insp, info, selectors, labels):
              cx, cy = int(info["cx"]), int(info["cy"])
              if axe_ready:
                  rc, out, err = run_cmd(["axe", "tap", "-x", str(cx), "-y", str(cy), "--udid", udid], timeout=15)
                  trace(f"axe tap ({cx},{cy}) rc={rc} msg={(err or out).strip()}")
                  if rc == 0:
                      return True, f"axe_tap({cx},{cy})"
              res = click_element_js(insp, selectors, labels)
              trace(f"js click fallback -> {res}")
              return res != "not-found", f"js_click({res})"

          def dump_page_state(insp, tag):
              try:
                  state = insp.eval_js("""(() => {
                    const iframes = Array.from(document.querySelectorAll('iframe')).map(f => {
                      let innerLen = -1;
                      let hasCanvas = false;
                      try {
                        innerLen = (f.contentDocument?.body?.innerText || '').trim().length;
                        hasCanvas = !!f.contentDocument?.querySelector('canvas');
                      } catch {}
                      return { src: f.getAttribute('src') || '', cls: f.className, hidden: f.closest('[data-hidden="true"]') !== null, innerLen, hasCanvas };
                    });
                    return {
                      lang: document.documentElement.lang,
                      navLang: navigator.language,
                      viewport: [window.innerWidth, window.innerHeight],
                      title: document.title,
                      bodyTextHead: (document.body?.innerText || '').trim().slice(0, 300),
                      iframes,
                      errors: window.__ieumSimErrors || [],
                    };
                  })()""")
                  (logs_dir / f"state-{tag}.json").write_text(json.dumps(state, ensure_ascii=False, indent=2), encoding="utf-8")
                  return state
              except Exception as exc:
                  trace(f"dump_page_state({tag}) error: {exc}")
                  return None

          def fail_step(insp, step_name, reason):
              shot = screenshot(f"stuck-{step_name}.png")
              if insp:
                  dump_page_state(insp, f"stuck-{step_name}")
              record_memory(f"stuck-{step_name}")
              summary["stuck_at"] = step_name
              summary["stuck_reason"] = reason
              summary["steps"].append({"step": step_name, "ok": False, "reason": reason, "screenshot": shot})
              trace(f"[STUCK] {step_name}: {reason}")

          def run_flow():
              time.sleep(6)
              insp = connect_inspector()
              if not insp:
                  shot1 = screenshot("01-first-screen.png")
                  record_memory("01-first-screen")
                  fail_step(None, "01-connect-inspector", "Could not connect to iOS Simulator com.apple.webinspectord socket")
                  return
              summary["inspector_connected"] = True
              try:
                  install_error_hook(insp)

                  # Step 1: First screen (welcome overlay)
                  el_start = wait_for_element(
                      insp,
                      "01-first-screen",
                      ['[data-testid="home-run-first-start"]', '[data-testid="home-empty-sample"]'],
                      ["시작하기", "Get started", "예시 문서 열어 보기", "Open the sample document"],
                      timeout_s=25.0,
                  )
                  shot1 = screenshot("01-first-screen.png")
                  dump_page_state(insp, "01-first-screen")
                  record_memory("01-first-screen")
                  if not el_start:
                      fail_step(insp, "01-first-screen", "Initial welcome or home control not found in DOM")
                      return
                  summary["steps"].append({"step": "01-first-screen", "ok": True, "matched": el_start, "screenshot": shot1})
                  trace(f"[OK] 01-first-screen ({el_start['how']})")

                  # Step 2: Tap [Start / 시작하기] -> Home
                  if el_start.get("testId") == "home-run-first-start" or el_start.get("text") in ("시작하기", "Get started"):
                      ok, via = tap_element(insp, el_start, ['[data-testid="home-run-first-start"]'], ["시작하기", "Get started"])
                      time.sleep(2.0)
                      el_home = wait_for_element(
                          insp,
                          "02-home",
                          ['[data-testid="home-empty-sample"]', '[data-testid="home-new-md-btn"]'],
                          ["예시 문서 열어 보기", "Open the sample document", "새 마크다운", "New Markdown"],
                          timeout_s=8.0,
                      )
                      if not el_home:
                          # Fallback click via JS in case HID tap missed safe-area offset
                          click_element_js(insp, ['[data-testid="home-run-first-start"]'], ["시작하기", "Get started"])
                          time.sleep(2.0)
                          el_home = wait_for_element(
                              insp,
                              "02-home-js",
                              ['[data-testid="home-empty-sample"]', '[data-testid="home-new-md-btn"]'],
                              ["예시 문서 열어 보기", "Open the sample document", "새 마크다운", "New Markdown"],
                              timeout_s=10.0,
                          )
                  else:
                      via = "already-home"
                      el_home = el_start

                  shot2 = screenshot("02-home.png")
                  dump_page_state(insp, "02-home")
                  record_memory("02-home")
                  if not el_home:
                      fail_step(insp, "02-home", "Home screen did not appear after tapping Start")
                      return
                  summary["steps"].append({"step": "02-home", "ok": True, "via": via, "matched": el_home, "screenshot": shot2})
                  trace(f"[OK] 02-home ({el_home['how']})")

                  # Step 3: Tap [Open sample HWP / 예시 문서 열어 보기] -> HWP Reading (Flow) view
                  el_sample = wait_for_element(
                      insp,
                      "03-find-sample",
                      ['[data-testid="home-empty-sample"]'],
                      ["예시 문서 열어 보기", "Open the sample document"],
                      timeout_s=10.0,
                  )
                  if not el_sample:
                      fail_step(insp, "03-open-sample-hwp", "Sample document button not found on Home")
                      return
                  ok, via = tap_element(insp, el_sample, ['[data-testid="home-empty-sample"]'], ["예시 문서 열어 보기", "Open the sample document"])
                  time.sleep(4.0)
                  el_page_btn = wait_for_element(
                      insp,
                      "03-hwp-flow",
                      ['[data-testid="view-tool-pageView"]'],
                      ["쪽 화면", "Page view"],
                      timeout_s=30.0,
                  )
                  if not el_page_btn:
                      click_element_js(insp, ['[data-testid="home-empty-sample"]'], ["예시 문서 열어 보기", "Open the sample document"])
                      time.sleep(4.0)
                      el_page_btn = wait_for_element(
                          insp,
                          "03-hwp-flow-js",
                          ['[data-testid="view-tool-pageView"]'],
                          ["쪽 화면", "Page view"],
                          timeout_s=25.0,
                      )
                  time.sleep(3.0)
                  shot3 = screenshot("03-hwp-flow.png")
                  dump_page_state(insp, "03-hwp-flow")
                  record_memory("03-hwp-flow")
                  if not el_page_btn:
                      fail_step(insp, "03-hwp-flow", "HWP reading view / Page view toggle did not appear")
                      return
                  summary["steps"].append({"step": "03-hwp-flow", "ok": True, "via": via, "matched": el_page_btn, "screenshot": shot3})
                  trace(f"[OK] 03-hwp-flow ({el_page_btn['how']})")

                  # Step 4: Switch Reading view -> Page view
                  ok, via = tap_element(insp, el_page_btn, ['[data-testid="view-tool-pageView"]'], ["쪽 화면", "Page view"])
                  time.sleep(4.0)
                  el_flow_btn = wait_for_element(
                      insp,
                      "04-hwp-page",
                      ['[data-testid="view-tool-flowView"]'],
                      ["읽기 화면", "Reading view"],
                      timeout_s=20.0,
                  )
                  if not el_flow_btn:
                      click_element_js(insp, ['[data-testid="view-tool-pageView"]'], ["쪽 화면", "Page view"])
                      time.sleep(4.0)
                      el_flow_btn = wait_for_element(
                          insp,
                          "04-hwp-page-js",
                          ['[data-testid="view-tool-flowView"]'],
                          ["읽기 화면", "Reading view"],
                          timeout_s=20.0,
                      )
                  time.sleep(3.0)
                  shot4 = screenshot("04-hwp-page.png")
                  dump_page_state(insp, "04-hwp-page")
                  record_memory("04-hwp-page")
                  if not el_flow_btn:
                      fail_step(insp, "04-hwp-page", "HWP page view / Reading view toggle did not appear")
                      return
                  summary["steps"].append({"step": "04-hwp-page", "ok": True, "via": via, "matched": el_flow_btn, "screenshot": shot4})
                  trace(f"[OK] 04-hwp-page ({el_flow_btn['how']})")

                  # Step 5: Switch Page view -> Reading view
                  ok, via = tap_element(insp, el_flow_btn, ['[data-testid="view-tool-flowView"]'], ["읽기 화면", "Reading view"])
                  time.sleep(2.5)
                  el_page_again = wait_for_element(
                      insp,
                      "05-hwp-flow-return",
                      ['[data-testid="view-tool-pageView"]'],
                      ["쪽 화면", "Page view"],
                      timeout_s=15.0,
                  )
                  if not el_page_again:
                      click_element_js(insp, ['[data-testid="view-tool-flowView"]'], ["읽기 화면", "Reading view"])
                      time.sleep(2.5)
                      el_page_again = wait_for_element(
                          insp,
                          "05-hwp-flow-return-js",
                          ['[data-testid="view-tool-pageView"]'],
                          ["쪽 화면", "Page view"],
                          timeout_s=15.0,
                      )
                  shot5 = screenshot("05-hwp-flow-return.png")
                  dump_page_state(insp, "05-hwp-flow-return")
                  record_memory("05-hwp-flow-return")
                  if not el_page_again:
                      fail_step(insp, "05-hwp-flow-return", "Could not return to HWP reading view")
                      return
                  summary["steps"].append({"step": "05-hwp-flow-return", "ok": True, "via": via, "matched": el_page_again, "screenshot": shot5})
                  trace("[OK] 05-hwp-flow-return")

                  # Step 6: Tap [Back / 뒤로] -> Home
                  el_back = wait_for_element(insp, "06-find-back", ['[data-testid="editor-back-btn"]'], ["뒤로", "Back"], timeout_s=10.0)
                  if not el_back:
                      fail_step(insp, "06-back-to-home", "Editor Back button not found")
                      return
                  ok, via = tap_element(insp, el_back, ['[data-testid="editor-back-btn"]'], ["뒤로", "Back"])
                  time.sleep(2.0)
                  el_md = wait_for_element(
                      insp,
                      "06-home-after-hwp",
                      ['[data-testid="home-new-md-btn"]', '[data-testid="home-fab"]'],
                      ["새 마크다운", "New Markdown", "새로 만들기", "Create new"],
                      timeout_s=12.0,
                  )
                  if not el_md:
                      click_element_js(insp, ['[data-testid="editor-back-btn"]'], ["뒤로", "Back"])
                      time.sleep(2.0)
                      el_md = wait_for_element(
                          insp,
                          "06-home-after-hwp-js",
                          ['[data-testid="home-new-md-btn"]', '[data-testid="home-fab"]'],
                          ["새 마크다운", "New Markdown", "새로 만들기", "Create new"],
                          timeout_s=12.0,
                      )
                  shot6 = screenshot("06-home-after-hwp.png")
                  dump_page_state(insp, "06-home-after-hwp")
                  record_memory("06-home-after-hwp")
                  if not el_md:
                      fail_step(insp, "06-back-to-home", "Did not return to Home after tapping Back")
                      return
                  summary["steps"].append({"step": "06-back-to-home", "ok": True, "via": via, "matched": el_md, "screenshot": shot6})
                  trace(f"[OK] 06-back-to-home ({el_md['how']})")

                  # Step 7: Tap [New Markdown / 새 마크다운]
                  if el_md.get("testId") == "home-fab":
                      tap_element(insp, el_md, ['[data-testid="home-fab"]'], ["새로 만들기", "Create new"])
                      time.sleep(1.5)
                      el_md = wait_for_element(insp, "07-create-sheet", ['[data-testid="home-create-md"]'], ["새 마크다운", "New Markdown"], timeout_s=10.0)
                      if not el_md:
                          fail_step(insp, "07-new-markdown", "New Markdown option not found in Create sheet")
                          return
                  ok, via = tap_element(insp, el_md, ['[data-testid="home-new-md-btn"]', '[data-testid="home-create-md"]'], ["새 마크다운", "New Markdown"])
                  time.sleep(3.0)
                  el_md_back = wait_for_element(insp, "07-new-markdown", ['[data-testid="editor-back-btn"]'], ["뒤로", "Back"], timeout_s=15.0)
                  if not el_md_back:
                      click_element_js(insp, ['[data-testid="home-new-md-btn"]', '[data-testid="home-create-md"]'], ["새 마크다운", "New Markdown"])
                      time.sleep(3.0)
                      el_md_back = wait_for_element(insp, "07-new-markdown-js", ['[data-testid="editor-back-btn"]'], ["뒤로", "Back"], timeout_s=15.0)
                  shot7 = screenshot("07-new-markdown.png")
                  dump_page_state(insp, "07-new-markdown")
                  record_memory("07-new-markdown")
                  if not el_md_back:
                      fail_step(insp, "07-new-markdown", "New Markdown editor did not open")
                      return
                  summary["steps"].append({"step": "07-new-markdown", "ok": True, "via": via, "matched": el_md_back, "screenshot": shot7})
                  trace("[OK] 07-new-markdown")

                  # Step 8: Tap [Back / 뒤로] -> Home -> Tap [Settings / 설정]
                  tap_element(insp, el_md_back, ['[data-testid="editor-back-btn"]'], ["뒤로", "Back"])
                  time.sleep(2.0)
                  el_settings = wait_for_element(
                      insp,
                      "08-find-settings",
                      ['[data-testid="home-tab-settings"]', '[data-testid="home-settings-btn"]'],
                      ["설정", "Settings"],
                      timeout_s=12.0,
                  )
                  if not el_settings:
                      click_element_js(insp, ['[data-testid="editor-back-btn"]'], ["뒤로", "Back"])
                      time.sleep(2.0)
                      el_settings = wait_for_element(
                          insp,
                          "08-find-settings-js",
                          ['[data-testid="home-tab-settings"]', '[data-testid="home-settings-btn"]'],
                          ["설정", "Settings"],
                          timeout_s=12.0,
                      )
                  if not el_settings:
                      fail_step(insp, "08-settings", "Settings button/tab not found after returning from Markdown")
                      return
                  ok, via = tap_element(insp, el_settings, ['[data-testid="home-tab-settings"]', '[data-testid="home-settings-btn"]'], ["설정", "Settings"])
                  time.sleep(2.5)
                  # Verify Settings heading/screen appeared; fallback to JS click if needed.
                  st = dump_page_state(insp, "08-settings")
                  if st and "설정" not in (st.get("bodyTextHead") or "") and "Settings" not in (st.get("bodyTextHead") or ""):
                      click_element_js(insp, ['[data-testid="home-tab-settings"]', '[data-testid="home-settings-btn"]'], ["설정", "Settings"])
                      time.sleep(2.0)
                      st = dump_page_state(insp, "08-settings-js")
                  shot8 = screenshot("08-settings.png")
                  record_memory("08-settings")
                  summary["steps"].append({"step": "08-settings", "ok": True, "via": via, "matched": el_settings, "screenshot": shot8})
                  trace("[OK] 08-settings")

                  # Collect all JS errors accumulated during the walk-through.
                  errs = insp.eval_js("window.__ieumSimErrors || []")
                  summary["webview_console_errors"] = errs or []
              finally:
                  insp.close()

          run_flow()

          (logs_dir / "webinspector-trace.txt").write_text("\n".join(trace_lines) + "\n", encoding="utf-8")
          (logs_dir / "webview-console-errors.json").write_text(
              json.dumps(summary["webview_console_errors"], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (logs_dir / "smoke-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          lines = [
              f"UDID: {summary['udid']}",
              f"App PID: {summary['app_pid']}",
              f"AXe ready: {summary['axe_ready']}",
              f"WebInspector connected: {summary['inspector_connected']}",
              f"WebView JS errors: {len(summary['webview_console_errors'])}",
              f"Stuck at: {summary['stuck_at']} ({summary['stuck_reason']})",
              "",
              "Steps:",
          ]
          for s in summary["steps"]:
              lines.append(f"  - {s['step']}: ok={s['ok']} via={s.get('via', '')} shot={s.get('screenshot', {}).get('file')} info={s.get('reason') or (s.get('matched') or {}).get('how', '')}")
          (logs_dir / "smoke-summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")

          mem_lines = []
          for m in summary["memory_samples"]:
              mem_lines.append(f"=== {m['label']} ({m['time']}) ===")
              mem_lines.extend(m["ps"] or ["(no matching processes)"])
              if m.get("footprint_head"):
                  mem_lines.append("--- app footprint ---")
                  mem_lines.append(m["footprint_head"])
              if m.get("webcontent_footprint_head"):
                  mem_lines.append("--- webcontent footprint ---")
                  mem_lines.append(m["webcontent_footprint_head"])
              mem_lines.append("")
          (logs_dir / "memory.txt").write_text("\n".join(mem_lines), encoding="utf-8")

          print("\n".join(lines), flush=True)
          PY

          # Extract potential console / JS / Rust error lines after log stream settles.
          sleep 2
          {
            echo "=== Filtered WebKit console & error lines from sim-log-stream.txt ==="
            grep -v "found no value for key" "$LOG_STREAM" | grep -iE "error|exception|panic|uncaught|failed|rejected|crash|console|javascript|page message" | head -n 400 || true
            echo ""
            echo "=== app-stderr.txt ==="
            cat "$ART_DIR/logs/app-stderr.txt" || true
          } > "$ART_DIR/logs/console-errors.txt"

      - name: Upload iOS Simulator artifacts (screenshots, logs, .app zip)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ieumoffice-mobile-ios-sim
          path: ${{ runner.temp }}/ios-sim-artifacts
          retention-days: 7
          if-no-files-found: warn
