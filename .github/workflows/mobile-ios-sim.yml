                      time.sleep(2.0)
                      dump_page_state(insp, "10-settings")
                      shot10 = screenshot("10-settings.png")
                      record_memory("10-settings")
                      summary["steps"].append({"step": "10-settings", "ok": True, "via": via, "matched": el_settings, "screenshot": shot10})
                      trace("[OK] 10-settings")

                  # Collect all JS errors accumulated during the walk-through.
                  errs = insp.eval_js("window.__ieumSimErrors || []")
                  summary["webview_console_errors"] = errs or []
              finally:
                  insp.close()

          run_flow()

          (logs_dir / "webinspector-trace.txt").write_text("\n".join(trace_lines) + "\n", encoding="utf-8")
          (logs_dir / "webview-console-errors.json").write_text(
              json.dumps(summary["webview_console_errors"], ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          (logs_dir / "smoke-summary.json").write_text(
              json.dumps(summary, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          lines = [
              f"UDID: {summary['udid']}",
              f"App PID: {summary['app_pid']}",
              f"AXe ready: {summary['axe_ready']}",
              f"WebInspector connected: {summary['inspector_connected']}",
              f"WebView JS errors: {len(summary['webview_console_errors'])}",
              f"Stuck at: {summary['stuck_at']} ({summary['stuck_reason']})",
              "",
              "Steps:",
          ]
          for s in summary["steps"]:
              lines.append(f"  - {s['step']}: ok={s['ok']} via={s.get('via', '')} shot={s.get('screenshot', {}).get('file')} info={s.get('reason') or (s.get('matched') or {}).get('how', '')}")
          (logs_dir / "smoke-summary.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")

          mem_lines = []
          for m in summary["memory_samples"]:
              mem_lines.append(f"=== {m['label']} ({m['time']}) ===")
              mem_lines.extend(m["ps"] or ["(no matching processes)"])
              if m.get("footprint_head"):
                  mem_lines.append("--- app footprint ---")
                  mem_lines.append(m["footprint_head"])
              if m.get("webcontent_footprint_head"):
                  mem_lines.append("--- webcontent footprint ---")
                  mem_lines.append(m["webcontent_footprint_head"])
              mem_lines.append("")
          (logs_dir / "memory.txt").write_text("\n".join(mem_lines), encoding="utf-8")

          print("\n".join(lines), flush=True)
          PY

          # Extract potential console / JS / Rust error lines after log stream settles.
          sleep 2
          {
            echo "=== WebKit CONSOLE messages from sim-log-stream.txt ==="
            grep "CONSOLE " "$LOG_STREAM" | head -n 400 || true
            echo ""
            echo "=== Filtered WebKit/app error lines from sim-log-stream.txt ==="
            grep -v "found no value for key" "$LOG_STREAM" | grep -iE "IeumFilePlugin|error|exception|panic|uncaught|failed|rejected|crash" | head -n 300 || true
            echo ""
            echo "=== app-stderr.txt ==="
            cat "$ART_DIR/logs/app-stderr.txt" || true
          } > "$ART_DIR/logs/console-errors.txt"

      - name: Capture App Store screenshots (iPhone 6.9 & iPad 13, ko-KR & en-US)
        id: store_shots
        if: success()
        env:
          ART_DIR: ${{ steps.build_sim.outputs.art_dir }}
          APP_PATH: ${{ steps.build_sim.outputs.app_path }}
          BUNDLE_ID: ${{ steps.build_sim.outputs.bundle_id }}
          AXE_READY: ${{ steps.install_axe.outputs.axe_ready }}
        run: |
          set -euo pipefail
          xcrun simctl shutdown all 2>/dev/null || true

          # Compile a tiny CoreGraphics helper to strip alpha channels so every PNG
          # is opaque 24-bit RGB (colorType=2) as required by App Store Connect.
          STRIP_ALPHA_BIN="$RUNNER_TEMP/strip-png-alpha"
          cat > "$RUNNER_TEMP/strip-png-alpha.swift" <<'SWIFT'
          import Foundation
          import CoreGraphics
          import ImageIO
          import UniformTypeIdentifiers

          for path in CommandLine.arguments.dropFirst() {
              let url = URL(fileURLWithPath: path)
              guard let src = CGImageSourceCreateWithURL(url as CFURL, nil),
                    let img = CGImageSourceCreateImageAtIndex(src, 0, nil) else {
                  fputs("Failed to read PNG: \(path)\n", stderr)
                  exit(1)
              }
              let w = img.width
              let h = img.height
              let cs = img.colorSpace ?? CGColorSpace(name: CGColorSpace.sRGB)!
              guard let ctx = CGContext(
                  data: nil,
                  width: w,
                  height: h,
                  bitsPerComponent: 8,
                  bytesPerRow: 0,
                  space: cs,
                  bitmapInfo: CGImageAlphaInfo.noneSkipLast.rawValue
              ) else {
                  fputs("Failed to create RGB CGContext: \(path)\n", stderr)
                  exit(1)
              }
              ctx.setFillColor(CGColor(red: 1, green: 1, blue: 1, alpha: 1))
              ctx.fill(CGRect(x: 0, y: 0, width: w, height: h))
              ctx.draw(img, in: CGRect(x: 0, y: 0, width: w, height: h))
              guard let rgb = ctx.makeImage(),
                    let dst = CGImageDestinationCreateWithURL(url as CFURL, UTType.png.identifier as CFString, 1, nil) else {
                  fputs("Failed to encode RGB PNG: \(path)\n", stderr)
                  exit(1)
              }
              CGImageDestinationAddImage(dst, rgb, nil)
              if !CGImageDestinationFinalize(dst) {
                  fputs("Failed to finalize RGB PNG: \(path)\n", stderr)
                  exit(1)
              }
          }
          SWIFT
          swiftc -O "$RUNNER_TEMP/strip-png-alpha.swift" -o "$STRIP_ALPHA_BIN"

          STRIP_ALPHA_BIN="$STRIP_ALPHA_BIN" python3 - <<'PY'
          import io
          import json
          import os
          import plistlib
          import socket
          import struct
          import subprocess
          import sys
          import time
          import unicodedata
          import uuid
          import zipfile
          import zlib
          from pathlib import Path

          art_dir = Path(os.environ["ART_DIR"])
          app_path = os.environ["APP_PATH"]
          bundle_id = os.environ.get("BUNDLE_ID", "com.ieumoffice.mobile")
          axe_ready = os.environ.get("AXE_READY") == "true"
          strip_alpha_bin = os.environ["STRIP_ALPHA_BIN"]
          repo_root = Path.cwd()
          shots_root = art_dir / "store-shots"
          shots_root.mkdir(parents=True, exist_ok=True)
          logs_dir = art_dir / "logs"

          trace_lines = []
          def trace(msg):
              line = f"[{time.strftime('%H:%M:%S')}] {msg}"
              trace_lines.append(line)
              print(line, flush=True)

          def run_cmd(cmd, timeout=45):
              try:
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)
                  return p.returncode, p.stdout, p.stderr
              except Exception as exc:
                  return -1, "", str(exc)

          def apply_clean_status_bar(udid):
              run_cmd([
                  "xcrun", "simctl", "status_bar", udid, "override",
                  "--time", "9:41",
                  "--dataNetwork", "wifi",
                  "--wifiMode", "active",
                  "--wifiBars", "3",
                  "--cellularMode", "active",
                  "--cellularBars", "4",
                  "--operatorName", "",
                  "--batteryState", "charged",
                  "--batteryLevel", "100",
              ], timeout=15)

          def pick_sim_device(preferred_substrings):
              rc, out, err = run_cmd(["xcrun", "simctl", "list", "devices", "available", "-j"], timeout=20)
              if rc != 0:
                  raise RuntimeError(f"simctl list failed: {err}")
              data = json.loads(out)
              for sub in preferred_substrings:
                  matches = []
                  for runtime, devices in data.get("devices", {}).items():
                      if "iOS" not in runtime:
                          continue
                      for d in devices:
                          if d.get("isAvailable") and sub.lower() in d.get("name", "").lower():
                              matches.append((runtime, d["name"], d["udid"]))
                  if matches:
                      matches.sort(key=lambda item: (item[0], item[1]))
                      return matches[-1]
              raise RuntimeError(f"No available simulator matched {preferred_substrings}")

          def find_webinspectord_socket(udid):
              candidates = []
              rc, out, _ = run_cmd(["xcrun", "simctl", "getenv", udid, "RWI_LISTEN_SOCKET"], timeout=10)
              if rc == 0 and out.strip():
                  candidates.append(out.strip())
              rc2, out2, _ = run_cmd(["lsof", "-aUc", "launchd_sim"], timeout=10)
              if rc2 == 0:
                  for line in out2.splitlines():
                      if "webinspectord_sim.socket" in line:
                          parts = line.split()
                          if parts and parts[-1].startswith("/") and parts[-1] not in candidates:
                              candidates.append(parts[-1])
              return candidates

          class WebInspectorClient:
              def __init__(self, sock_path):
                  self.sock = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
                  self.sock.settimeout(12.0)
                  self.sock.connect(sock_path)
                  self.conn_id = str(uuid.uuid4()).upper()
                  self.sender_id = str(uuid.uuid4()).upper()
                  self.app_id = None
                  self.page_id = None
                  self.target_id = None
                  self.next_id = 1

              def close(self):
                  try:
                      self.sock.close()
                  except Exception:
                      pass

              def send_rpc(self, selector, argument):
                  payload = plistlib.dumps({"__selector": selector, "__argument": argument}, fmt=plistlib.FMT_BINARY)
                  self.sock.sendall(struct.pack("!I", len(payload)) + payload)

              def recv_exact(self, n):
                  buf = bytearray()
                  while len(buf) < n:
                      chunk = self.sock.recv(n - len(buf))
                      if not chunk:
                          raise EOFError("WebInspector socket closed")
                      buf.extend(chunk)
                  return bytes(buf)

              def recv_rpc(self, timeout=10.0):
                  self.sock.settimeout(timeout)
                  hdr = self.recv_exact(4)
                  (length,) = struct.unpack("!I", hdr)
                  return plistlib.loads(self.recv_exact(length))

              def connect(self, timeout_s=25.0):
                  self.send_rpc("_rpc_reportIdentifier:", {"WIRConnectionIdentifierKey": self.conn_id})
                  deadline = time.time() + timeout_s
                  listing_requested = False
                  socket_setup_sent = False
                  while time.time() < deadline:
                      try:
                          msg = self.recv_rpc(timeout=max(0.5, deadline - time.time()))
                      except socket.timeout:
                          break
                      sel = msg.get("__selector", "")
                      arg = msg.get("__argument", {}) or {}
                      if sel == "_rpc_reportConnectedApplicationList:":
                          apps = arg.get("WIRApplicationDictionaryKey") or {}
                          for aid, info in apps.items():
                              b = str(info.get("WIRApplicationBundleIdentifierKey") or "")
                              n = str(info.get("WIRApplicationNameKey") or "")
                              if bundle_id in b or "IeumOffice" in b or "IeumOffice" in n:
                                  self.app_id = aid
                                  break
                      elif sel in ("_rpc_applicationConnected:", "_rpc_applicationUpdated:"):
                          aid = arg.get("WIRApplicationIdentifierKey")
                          b = str(arg.get("WIRApplicationBundleIdentifierKey") or "")
                          n = str(arg.get("WIRApplicationNameKey") or "")
                          if aid and (bundle_id in b or "IeumOffice" in b or "IeumOffice" in n):
                              self.app_id = aid
                      if self.app_id and not listing_requested:
                          self.send_rpc("_rpc_getConnectedApplications:", {"WIRConnectionIdentifierKey": self.conn_id})
                          self.send_rpc("_rpc_forwardGetListing:", {
                              "WIRConnectionIdentifierKey": self.conn_id,
                              "WIRApplicationIdentifierKey": self.app_id,
                          })
                          listing_requested = True
                      if sel == "_rpc_applicationSentListing:":
                          listing = arg.get("WIRListingKey") or {}
                          chosen = None
                          for _, p in listing.items():
                              url = str(p.get("WIRURLKey") or "")
                              ptype = str(p.get("WIRTypeKey") or "")
                              pid_val = p.get("WIRPageIdentifierKey")
                              if pid_val is not None:
                                  if url.startswith("tauri://"):
                                      chosen = pid_val
                                      break
                                  if chosen is None and ("Web" in ptype or url):
                                      chosen = pid_val
                          if chosen is not None and not socket_setup_sent:
                              self.page_id = chosen
                              self.send_rpc("_rpc_forwardSocketSetup:", {
                                  "WIRConnectionIdentifierKey": self.conn_id,
                                  "WIRApplicationIdentifierKey": self.app_id,
                                  "WIRPageIdentifierKey": self.page_id,
                                  "WIRSenderKey": self.sender_id,
                                  "WIRAutomaticallyPause": False,
                              })
                              socket_setup_sent = True
                      if sel == "_rpc_applicationSentData:":
                          raw = arg.get("WIRMessageDataKey")
                          if isinstance(raw, (bytes, bytearray)):
                              try:
                                  data = json.loads(raw.decode("utf-8", errors="replace"))
                                  if data.get("method") == "Target.targetCreated":
                                      tinfo = (data.get("params") or {}).get("targetInfo") or {}
                                      tid = tinfo.get("targetId")
                                      ttype = tinfo.get("type")
                                      if tid and (self.target_id is None or ttype == "page"):
                                          self.target_id = tid
                                          return True
                              except Exception:
                                  pass
                  return socket_setup_sent

              def eval_js(self, expression, timeout_s=30.0):
                  cmd_id = self.next_id
                  self.next_id += 1
                  inner = {
                      "id": cmd_id,
                      "method": "Runtime.evaluate",
                      "params": {
                          "expression": expression,
                          "returnByValue": True,
                          "awaitPromise": False,
                      },
                  }
                  if self.target_id:
                      outer_id = self.next_id
                      self.next_id += 1
                      payload_obj = {
                          "id": outer_id,
                          "method": "Target.sendMessageToTarget",
                          "params": {
                              "targetId": self.target_id,
                              "message": json.dumps(inner),
                          },
                      }
                  else:
                      payload_obj = inner
                  self.send_rpc("_rpc_forwardSocketData:", {
                      "WIRConnectionIdentifierKey": self.conn_id,
                      "WIRApplicationIdentifierKey": self.app_id,
                      "WIRPageIdentifierKey": self.page_id,
                      "WIRSenderKey": self.sender_id,
                      "WIRSocketDataKey": json.dumps(payload_obj).encode("utf-8"),
                  })
                  deadline = time.time() + timeout_s
                  while time.time() < deadline:
                      try:
                          msg = self.recv_rpc(timeout=max(0.5, deadline - time.time()))
                      except socket.timeout:
                          break
                      if msg.get("__selector") != "_rpc_applicationSentData:":
                          continue
                      raw = (msg.get("__argument") or {}).get("WIRMessageDataKey")
                      if not isinstance(raw, (bytes, bytearray)):
                          continue
                      data = json.loads(raw.decode("utf-8", errors="replace"))
                      if data.get("method") == "Target.targetCreated":
                          tinfo = (data.get("params") or {}).get("targetInfo") or {}
                          if tinfo.get("type") == "page" and tinfo.get("targetId"):
                              self.target_id = tinfo["targetId"]
                          continue
                      if data.get("method") == "Target.dispatchMessageFromTarget":
                          inner_str = (data.get("params") or {}).get("message", "")
                          if not inner_str:
                              continue
                          inner_data = json.loads(inner_str)
                          if inner_data.get("id") == cmd_id:
                              return self._unwrap(inner_data)
                      elif data.get("id") == cmd_id:
                          return self._unwrap(data)
                  raise TimeoutError(f"Runtime.evaluate timed out (cmd_id={cmd_id})")

              def _unwrap(self, resp):
                  if "error" in resp:
                      raise RuntimeError(f"Inspector error: {resp['error']}")
                  res = resp.get("result") or {}
                  if res.get("wasThrown"):
                      raise RuntimeError(f"JS exception: {res.get('result')}")
                  return (res.get("result") or {}).get("value")

