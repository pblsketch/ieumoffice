name: Mobile Build

# Verifies the IeumOffice Mobile (Android and iOS, Tauri 2 Mobile) Rust backend,
# bridge/renderer tests, studio bundling, and unsigned Android/iOS builds.
# Path-filtered so desktop-only changes do not trigger mobile builds.

on:
  push:
    branches: [main, 'dryforge/mobile-*']
    paths:
      - 'apps/mobile/**'
      - 'packages/mobile-bridge/**'
      - 'packages/hwp5-wasm/**'
      - 'packages/ai-provider/**'
      - 'packages/agent-core/**'
      - 'packages/i18n/**'
      - 'packages/ui/**'
      - 'apps/hwp/scripts/rhwp-patches.mjs'
      - 'apps/hwp/scripts/build-studio.mjs'
      - '.github/workflows/mobile-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/mobile-bridge/**'
      - 'packages/hwp5-wasm/**'
      - 'packages/ai-provider/**'
      - 'packages/agent-core/**'
      - 'packages/i18n/**'
      - 'packages/ui/**'
      - 'apps/hwp/scripts/rhwp-patches.mjs'
      - 'apps/hwp/scripts/build-studio.mjs'
      - '.github/workflows/mobile-build.yml'
  workflow_dispatch:
    inputs:
      publish_play_internal:
        description: 'Upload signed AAB to Google Play Internal Testing track (requires GOOGLE_PLAY_SERVICE_ACCOUNT_JSON)'
        required: false
        type: boolean
        default: false
      release_status:
        description: 'Google Play release status (use draft until the Play Console app is published)'
        required: false
        type: choice
        default: draft
        options:
          - draft
          - completed

concurrency:
  group: mobile-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  mobile-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable

      - name: Cache cargo (mobile)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            apps/mobile/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Check Rust dependency licenses (mobile)
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
          manifest-path: apps/mobile/src-tauri/Cargo.toml

      - name: Install Tauri Linux system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Run Rust mobile backend tests
        run: cargo test --manifest-path apps/mobile/src-tauri/Cargo.toml

      - name: Typecheck and test mobile packages
        run: |
          npm run typecheck -w @genoffice/mobile-bridge
          npm run test -w @genoffice/mobile-bridge
          npm run typecheck -w @genoffice/mobile
          npm run test -w @genoffice/mobile

      - name: Run repository hygiene checks
        run: |
          npm run check:theme-colors
          npm run check:lang-count
          npm run check:english-comments
          npm run check:no-genspark

      - name: Build rhwp studio and mobile web bundle
        run: |
          npm run studio -w @genoffice/hwp
          npm run build -w @genoffice/mobile
          test -f apps/mobile/dist/studio/index.html

  android-build:
    needs: mobile-checks
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (Android aarch64)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: aarch64-linux-android

      - name: Cache cargo (Android)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            apps/mobile/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and rhwp studio bundle
        run: |
          npm run studio -w @genoffice/hwp
          npm run build -w @genoffice/mobile
          test -f apps/mobile/dist/studio/index.html

      - name: Initialize Android project and inject native config
        working-directory: apps/mobile
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export NDK_HOME="${NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}}"
          npx --yes @tauri-apps/cli@2 android init --ci
          node scripts/apply-native-config.mjs android

      - name: Build and sign Android APK and AAB (release features, no dev loopback)
        id: android_build
        working-directory: apps/mobile
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export NDK_HOME="${NDK_HOME:-${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}}"
          export IEUM_ANDROID_VERSION_CODE=$((1000 + GITHUB_RUN_NUMBER))
          echo "Using Android versionCode: $IEUM_ANDROID_VERSION_CODE"

          mkdir -p dist-apk dist-aab
          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          KEYSTORE=""
          cleanup() {
            if [ -n "$KEYSTORE" ] && [ -f "$KEYSTORE" ]; then
              rm -f "$KEYSTORE"
            fi
          }
          trap cleanup EXIT

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ] && [ -n "${ANDROID_KEYSTORE_PASSWORD:-}" ] && [ -n "${ANDROID_KEY_ALIAS:-}" ] && [ -n "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "Fixed release keystore secrets detected: building signed APK and AAB."
            KEYSTORE="$RUNNER_TEMP/ieum-release.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            export ANDROID_KEYSTORE_PATH="$KEYSTORE"

            npx --yes @tauri-apps/cli@2 android build --apk --aab --target aarch64 --ci

            APK_SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name "*release*.apk" | head -n 1)
            AAB_SRC=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*release*.aab" | head -n 1)
            if [ -z "$APK_SRC" ] || [ -z "$AAB_SRC" ]; then
              echo "Expected both release APK and AAB outputs, found APK='$APK_SRC' AAB='$AAB_SRC'" >&2
              exit 1
            fi
            cp "$APK_SRC" dist-apk/ieumoffice-mobile-arm64.apk
            cp "$AAB_SRC" dist-aab/ieumoffice-mobile-arm64.aab
            "$BUILD_TOOLS/apksigner" verify --print-certs dist-apk/ieumoffice-mobile-arm64.apk
            jarsigner -verify dist-aab/ieumoffice-mobile-arm64.aab

            echo "apk_path=apps/mobile/dist-apk/ieumoffice-mobile-arm64.apk" >> "$GITHUB_OUTPUT"
            echo "has_aab=true" >> "$GITHUB_OUTPUT"
            echo "signing_mode=release" >> "$GITHUB_OUTPUT"
          else
            echo "Release keystore secrets not set (e.g. fork PR): building test-signed APK only."
            npx --yes @tauri-apps/cli@2 android build --apk --target aarch64 --ci
            APK_SRC=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
            if [ -z "$APK_SRC" ]; then
              echo "No Android APK output found" >&2
              exit 1
            fi
            KEYSTORE="$RUNNER_TEMP/ieum-test-signing.keystore"
            keytool -genkeypair -noprompt -keystore "$KEYSTORE" -storepass ieumtest -keypass ieumtest \
              -alias ieumtest -keyalg RSA -keysize 2048 -validity 365 \
              -dname "CN=IeumOffice Test, O=IeumOffice, C=KR"
            "$BUILD_TOOLS/zipalign" -f -p 4 "$APK_SRC" dist-apk/aligned.apk
            "$BUILD_TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-pass pass:ieumtest \
              --key-pass pass:ieumtest --ks-key-alias ieumtest \
              --out dist-apk/ieumoffice-mobile-arm64-test.apk dist-apk/aligned.apk
            rm -f dist-apk/aligned.apk

            echo "apk_path=apps/mobile/dist-apk/ieumoffice-mobile-arm64-test.apk" >> "$GITHUB_OUTPUT"
            echo "has_aab=false" >> "$GITHUB_OUTPUT"
            echo "signing_mode=ephemeral-test" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON:-}" ]; then
            echo "has_play_sa=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_play_sa=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload installable Android APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ieumoffice-mobile-android-apk
          path: ${{ steps.android_build.outputs.apk_path }}
          retention-days: 14

      - name: Upload Play-ready signed Android AAB
        if: steps.android_build.outputs.has_aab == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ieumoffice-mobile-android-aab
          path: apps/mobile/dist-aab/ieumoffice-mobile-arm64.aab
          retention-days: 14

      - name: Upload signed AAB to Google Play Internal Testing
        if: >-
          github.event_name == 'workflow_dispatch' &&
          inputs.publish_play_internal == true &&
          steps.android_build.outputs.has_aab == 'true' &&
          steps.android_build.outputs.has_play_sa == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.ieumoffice.mobile
          releaseFiles: apps/mobile/dist-aab/ieumoffice-mobile-arm64.aab
          track: internal
          status: ${{ inputs.release_status }}

  ios-build:
    needs: mobile-checks
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Rust (iOS aarch64)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable branch, 2026-07
        with:
          toolchain: stable
          targets: aarch64-apple-ios

      - name: Cache cargo (iOS)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            apps/mobile/src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build frontend and rhwp studio bundle
        run: |
          npm run studio -w @genoffice/hwp
          npm run build -w @genoffice/mobile
          test -f apps/mobile/dist/studio/index.html

      - name: Initialize iOS project and inject native config
        working-directory: apps/mobile
        run: |
          npx --yes @tauri-apps/cli@2 ios init --ci
          node scripts/apply-native-config.mjs ios

      - name: Verify iOS Rust compilation (release features, no dev loopback)
        run: |
          cargo build --release --target aarch64-apple-ios --manifest-path apps/mobile/src-tauri/Cargo.toml
