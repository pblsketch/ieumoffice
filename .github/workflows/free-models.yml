name: Free models

# Weekly look at OpenRouter's public model list against the free models the app
# offers (OPENROUTER_FREE_MODELS in packages/ai-provider/src/free-ai.ts). Reads
# no key and spends no free request. When an offered model is gone, the run
# fails with the report in its summary; GitHub mails a failed scheduled run to
# the repository owner. New free models with tool support are listed in the
# summary with a notice and do not fail the run: they appear most weeks, and a
# run that is red every week hid the one that named a withdrawn model
# (decision 0138). Trying a model in the app spends a real key's free requests
# and is done by hand (docs/operations.md, "무료 모델 점검").

on:
  schedule:
    - cron: '0 0 * * 1' # Mondays 09:00 KST
  workflow_dispatch:

concurrency:
  group: free-models
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Compare with OpenRouter
        run: |
          set +e
          node tools/check-free-models.mjs > report.md
          code=$?
          set -e
          cat report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if [ "$code" -eq 1 ]; then
            echo "::error title=Free models::An offered free model is gone from OpenRouter; see the run summary"
          elif [ "$code" -eq 0 ] && grep -q '^## 시험해 볼 새 무료 모델' report.md; then
            echo "::notice title=Free models::New free models to try; see the run summary"
          fi
          exit "$code"
