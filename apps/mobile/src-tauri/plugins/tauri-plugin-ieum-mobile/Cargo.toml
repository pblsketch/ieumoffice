[package]
name = "tauri-plugin-ieum-mobile"
version = "0.1.0"
description = "Local Tauri 2 mobile native bridge plugin for IeumOffice (Android SAF/FileProvider/Keystore/CustomTabs and iOS DocumentPicker/Share/Keychain/ASWebAuthenticationSession)"
authors = ["IeumOffice"]
license = "Apache-2.0"
edition = "2024"
publish = false
links = "tauri-plugin-ieum-mobile"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
